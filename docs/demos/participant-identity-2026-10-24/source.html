<script>
(() => {
  const root = document.getElementById('my-history-names');
  const MAX_LINKED_NAMES = 3;
  const config = { account: '未登录', platform: 'iOS', imported: false, screen:'关联历史名称' };
  let activeAccount=config.account;
  const state = { page: 'scan', stack:['start','names'], guestNameRef:null, guestUsed:false, sport:'羽毛球', nameType:'player', recordType:'all', showMoreRecords:false, selected: [], modal: null, accountNames: { a: '杨杨', b: '小林' }, groups: { a: '', b: '' }, links: { guest: {}, a: {}, b: {} }, pickerHidden:{guest:[],a:[],b:[]}, format:'singles', target:2, slots:[{name:'杨扬',person:null,current:false},{name:'',person:null,current:false},{name:'小林',person:null,current:false},{name:'',person:null,current:false}], notice: '' };
  const records = [
    { id: 'old-1', date: '2026.10.20', sport: '羽毛球 · 单打', a: ['杨扬'], b: ['小林'], score: [21,17] },
    { id: 'old-2', date: '2026.10.12', sport: '羽毛球 · 单打', a: ['杨扬'], b: ['阿杰'], score: [18,21] },
    { id: 'old-3', date: '2026.09.28', sport: '羽毛球 · 单打', a: ['小杨'], b: ['小林'], score: [21,16] },
    { id: 'old-4', date: '2026.09.18', sport: '羽毛球 · 双打', a: ['小杨','陈晨'], b: ['阿杰','李薇'], score: [21,17] },
    { id: 'old-5', date: '2026.08.05', sport: '乒乓球 · 单打', a: ['YY'], b: ['陈晨'], score: [11,8] },
    { id: 'old-6', date: '2026.07.12', sport: '羽毛球 · 单打', a: ['杨扬'], b: ['小杨'], score: [21,19] },
    { id: 'import-1', date: '2026.06.03', sport: '乒乓球 · 单打', a: ['YY'], b: ['小林'], score: [8,11], imported: true },
    { id: 'import-2', date: '2026.05.04', sport: '羽毛球 · 单打', a: ['杨扬'], b: ['小林'], score: [21,18], imported: true }
  ];
  const candidateOrder = ['杨扬','小杨','YY','小林','阿杰','陈晨','李薇'];
  const q = selector => root.querySelector(selector);
  const norm = name => name.trim().replace(/\s+/g,' ').toLowerCase();
  const esc = value => String(value).replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
  const who = () => config.account === '未登录' ? 'guest' : config.account === '杨杨' ? 'a' : 'b';
  const nick = () => who() === 'guest' ? state.guestNameRef || '我' : state.accountNames[who()];
  const available = () => records.filter(record => !record.imported || config.imported);
  const source = () => who() === 'guest' ? '本机历史记录' : '本机及当前账号的历史记录';
  const namesIn = record => [...record.a,...record.b];
  const mine = () => state.links[who()];
  const linkedCount = (owner = who()) => new Set(Object.keys(state.links[owner]).map(norm)).size;
  const proposedCount = (names, owner = who()) => new Set([...Object.keys(state.links[owner]),...names].map(norm)).size;
  const withinNameLimit = (names, owner = who()) => proposedCount(names,owner) <= MAX_LINKED_NAMES;
  function canSelectName(name) { return state.selected.includes(name) || withinNameLimit([...state.selected,name]); }
  const pageLabels = {start:'首页',records:'记录',personal:'我的参赛',names:'常用名称',scan:'关联历史名称',setup:'选人',group:'小组',groupNick:'小组昵称',me:'我的',profile:'个人资料'};
  const commonPlayers=['杨扬','小杨','YY','小林','阿杰','陈晨','李薇'];
  const commonTeams=['飞扬队','晨光队'];
  const baseMatches=[{id:'recent-self',date:'2026.10.23',sport:'羽毛球 · 单打',a:['杨杨'],b:['小林'],score:[21,18],owner:'a'},{id:'group-self',date:'2026.10.22',sport:'羽毛球 · 单打',a:['杨工'],b:['阿杰'],score:[21,19],owner:'a',group:true}];
  const activeSlots = () => state.format === 'doubles' ? [0,1,2,3] : [0,2];
  const slotLabel = index => (index < 2 ? '左侧' : '右侧') + (state.format === 'doubles' ? '选手' + (index % 2 + 1) : '');
  function currentSelfSlot() { return activeSlots().find(index => state.slots[index].person === who()); }
  function pickerEntries() {
    const hidden = new Set(state.pickerHidden[who()].map(norm));
    const entries = [{name:nick(),person:who(),current:true}];
    const seen = new Set(entries.map(entry => norm(entry.name)));
    for (const name of [...Object.keys(mine()),...commonPlayers]) {
      if (hidden.has(norm(name)) || seen.has(norm(name))) continue;
      seen.add(norm(name));
      entries.push({name,person:Object.hasOwn(mine(),name) ? who() : null,current:false});
    }
    return entries;
  }
  function canPick(entry, target = state.target) { return !entry.person || !activeSlots().some(index => index !== target && state.slots[index].person === entry.person); }
  function pickEntry(entry, target = state.target) {
    if (!canPick(entry,target)) return false;
    state.slots[target] = {name:entry.name,person:entry.person,current:entry.current === true};
    if(entry.person==='guest')state.guestUsed=true;
    return true;
  }
  function promoteGuest(){
    if(who()==='guest')return {ok:false,reason:'signed-out'};
    const names=Object.keys(state.links.guest);

  function bind() {
    root.querySelectorAll('[data-action]').forEach(button => button.onclick = () => action(button.dataset.action));
    root.querySelectorAll('[data-name]').forEach(input => input.onchange = () => { const name = input.dataset.name;if(input.checked&&!withinNameLimit([...state.selected,name])){input.checked=false;updateSummary();return;}state.selected = input.checked ? [...new Set([...state.selected,name])] : state.selected.filter(value => value !== name); updateSummary(); persist(); });
    root.querySelectorAll('[data-preview]').forEach(button => button.onclick = () => openModal({ kind: 'preview', name: button.dataset.preview }));
    root.querySelectorAll('[data-manage]').forEach(button => button.onclick = () => openModal({ kind: 'manage', name: button.dataset.manage }));
    root.querySelectorAll('[data-common]').forEach(button=>button.onclick=()=>openModal({kind:'common-name',name:button.dataset.common}));
    root.querySelectorAll('[data-main]').forEach(button=>button.onclick=()=>navigate(button.dataset.main,true));
    root.querySelectorAll('[data-game]').forEach(button=>button.onclick=()=>{state.sport=button.dataset.game;navigate('setup');});
    root.querySelectorAll('[data-name-type]').forEach(button=>button.onclick=()=>{state.nameType=button.dataset.nameType;render();persist();});
    root.querySelectorAll('[data-record-type]').forEach(button=>button.onclick=()=>{state.recordType=button.dataset.recordType;render();persist();});
    root.querySelectorAll('[data-record]').forEach(button=>button.onclick=()=>openModal({kind:'record',id:button.dataset.record}));
    root.querySelectorAll('[data-slot]').forEach(button=>button.onclick=()=>{state.target=Number(button.dataset.slot);render();persist();});
    root.querySelectorAll('[data-pick-index]').forEach(button=>button.onclick=()=>{const entry=pickerEntries()[Number(button.dataset.pickIndex)];if(entry&&pickEntry(entry)){render();persist();}});
    root.querySelectorAll('[data-format]').forEach(button=>button.onclick=()=>{state.format=button.dataset.format;if(state.format==='singles')for(const index of [1,3])state.slots[index]={name:'',person:null,current:false};if(!activeSlots().includes(state.target))state.target=0;render();persist();});
  }
  function action(name) {
    if(name==='names')state.nameType='player';
    if (Object.hasOwn(pageLabels,name)) return navigate(name);
    if(name==='more-records'){state.showMoreRecords=true;render();persist();return;}
    if(name==='places')return openModal({kind:'places'});
    if (name === 'confirm-names' && selectionSummary().count) return openModal({ kind: withinNameLimit(state.selected)?'confirm':'name-limit' });
    if (name === 'rename') return openModal({ kind: 'rename' });
    if (name === 'login') return signInAndPromote();
    if (name === 'transfer') {const result=promoteGuest();if(!result.ok)return openModal({kind:'transfer'});state.notice='本机的我已同步到当前账号';state.modal=null;render();persist();return;}
    if(name==='choose-me')return openModal({kind:'guest-name'});
    if (name === 'save-group') { state.groups[who()] = q('#group-name').value.trim().slice(0,20); state.notice = state.groups[who()] ? '已保存，只在这个小组使用。' : '已恢复跟随应用昵称。'; render(); q('[data-live]').textContent = '已保存小组昵称'; persist(); return; }
    if (name === 'reset-group') { state.groups[who()] = ''; state.notice = '已恢复跟随应用昵称。'; render(); persist(); return; }
    if(name==='manual-name')return openModal({kind:'manual-name'});
    if(name==='clear-slot'){state.slots[state.target]={name:'',person:null,current:false};render();persist();return;}
    if(name==='confirm-lineup'){const problem=lineupProblem();if(problem){q('[data-live]').textContent=problem;openModal({kind:'incomplete',message:problem});return;}return openModal({kind:'lineup'});}
  }
  function openModal(modal) { state.modal = modal; renderModal(); if (globalThis.lucide) lucide.createIcons({ attrs: { width: 18, height: 18 } }); q('[data-modal]').scrollIntoView({ block: 'center' }); q('[data-modal] button')?.focus({ preventScroll: true }); }
  function closeModal() { state.modal = null; renderModal(); }
  function renderModal() {
    const modal = state.modal;
    q('.modal-layer').hidden = !modal; q('.page').inert = !!modal;q('[data-app-tabs]').inert=!!modal;
    if (!modal) { q('[data-modal]').replaceChildren(); return; }
    let html = '';
    if (modal.kind === 'confirm') {
      const s = selectionSummary();
      html = '<h2>关联到“我”？</h2><p>' + state.selected.map(esc).join('、') + '<br><span class="sub">'+s.count+' 场旧记录 · '+esc(nick())+'</span></p>';
      if (s.conflicts) html += '<div class="callout amber">'+s.conflicts+' 场身份重叠，暂不计入统计。</div>';
      html += '<p class="fine">'+(who()==='guest'?'先保存在本机，登录后自动同步。':'保留原始名称和比分。')+'</p><button type="button" class="primary cursor-interaction" data-modal-action="apply">确认关联</button><button type="button" class="secondary cursor-interaction" data-modal-action="close">取消</button>';
    }
    if (modal.kind === 'success') html = '<div class="success-mark">' + icon('check') + '</div><h2>已关联 ' + modal.count + ' 场记录</h2><p>' + modal.names.map(esc).join('、') + ' <span class="pill">我</span></p>'+(who()==='guest'?'<p class="fine">已保存到本机的我</p>':'')+'<button type="button" class="primary cursor-interaction" data-modal-action="home">完成</button>'+(who()==='guest'?'<button type="button" class="secondary cursor-interaction" data-modal-action="login-sync">登录并同步</button>':'');
    if(modal.kind==='guest-name')html='<h2>选一个名称作为我</h2><div class="surface">'+commonPlayers.map(name=>'<button type="button" class="picker-row cursor-interaction" data-guest-pick="'+esc(name)+'" '+(!withinNameLimit([name])||foreignBound(name)?'disabled':'')+'>'+esc(name)+(state.guestNameRef===name?'<span class="pill">当前使用</span>':'')+'</button>').join('')+'</div><button type="button" class="secondary cursor-interaction" data-modal-action="close">取消</button>';
    if (modal.kind === 'preview') {
      const rows = available().filter(record => namesIn(record).includes(modal.name));
      html = '<h2>' + esc(modal.name) + ' · ' + rows.length + ' 场旧记录</h2><div class="preview-records">' + rows.slice(0,3).map(recordRow).join('') + '</div>' + (rows.length > 3 ? '<p class="fine">仅预览最近 3 场。关联时会处理该名字的全部候选旧记录。</p>' : '') + '<button type="button" class="secondary cursor-interaction" data-modal-action="close">返回选择名字</button>';
    }
    if (modal.kind === 'manage') html = '<h2>' + esc(modal.name) + ' <span class="pill">我</span></h2><p class="sub" style="text-align:center">'+(mine()[modal.name]||[]).length+' 场旧记录</p>'+(remaining(modal.name).length?'<button type="button" class="primary cursor-interaction" data-modal-action="supplement">补充 '+remaining(modal.name).length+' 场旧记录</button>':'')+(who()==='guest'||norm(modal.name)!==norm(nick())?'<button type="button" class="secondary cursor-interaction" data-modal-action="toggle-picker">'+(state.pickerHidden[who()].includes(modal.name)?'显示在选人列表':'从选人列表移除')+'</button>':'')+'<button type="button" class="secondary danger cursor-interaction" data-modal-action="ask-unlink">解除名称关联</button><button type="button" class="text-button cursor-interaction" style="width:100%" data-modal-action="close">完成</button>';
    if(modal.kind==='common-name')html='<h2>'+esc(modal.name)+'</h2>'+(withinNameLimit([modal.name])?'':'<p class="fine">已关联 3 / 3 个名称</p>')+'<button type="button" class="primary cursor-interaction" data-modal-action="associate-common" '+(!withinNameLimit([modal.name])||foreignBound(modal.name)?'disabled':'')+'>关联为我</button><button type="button" class="secondary cursor-interaction" data-modal-action="close">取消</button>';
    if(modal.kind==='record'){const record=[...baseMatches,...available()].find(value=>value.id===modal.id);html='<h2>比赛记录</h2>'+(record?'<p class="sub">'+record.date+' · '+record.sport+'</p>'+recordRow(record):'')+'<button type="button" class="secondary cursor-interaction" data-modal-action="close">完成</button>';}
    if(modal.kind==='places')html='<h2>常用地点</h2><p>市体育馆<br>周末羽毛球馆</p><button type="button" class="secondary cursor-interaction" data-modal-action="close">完成</button>';
    if(modal.kind==='unlink-confirm')html='<h2>解除“'+esc(modal.name)+'”的关联？</h2><p>其旧记录将不再按此名称计入“我”，以后选用该名称也不再标记“我”。</p><p class="fine">原始记录保留。已直接记录本人身份的新比赛不受影响。</p><button type="button" class="primary cursor-interaction" data-modal-action="unlink">解除关联</button><button type="button" class="secondary cursor-interaction" data-modal-action="close">取消</button>';
    if (modal.kind === 'rename') html = '<h2>修改昵称</h2><input class="name-input" aria-label="应用昵称" maxlength="20" value="' + esc(nick()) + '"><div class="actions"><button type="button" class="primary cursor-interaction" data-modal-action="save-name">保存</button><button type="button" class="secondary cursor-interaction" data-modal-action="close">取消</button></div>';
    if(modal.kind==='manual-name')html='<h2>填写名称</h2><input class="name-input" aria-label="普通参赛名称" maxlength="20" placeholder="选手名称"><p class="fine">作为普通选手，不标记“我”</p><button type="button" class="primary cursor-interaction" data-modal-action="save-manual">确定</button><button type="button" class="secondary cursor-interaction" data-modal-action="close">取消</button>';
    if(modal.kind==='incomplete')html='<h2>'+esc(modal.message||'请先选择所有选手')+'</h2><button type="button" class="primary cursor-interaction" data-modal-action="close">继续设置</button>';
    if(modal.kind==='lineup')html='<h2>参赛名单已确认</h2><div class="surface">'+activeSlots().map(index=>'<div class="detail-row"><span class="count">'+slotLabel(index)+'</span><div>'+esc(slotName(index))+(state.slots[index].person===who()?' <span class="pill">我</span>':'')+'</div></div>').join('')+'</div><button type="button" class="primary cursor-interaction" style="margin-top:18px" data-modal-action="close">完成预览</button>';
    if(modal.kind==='help'){
      const help={start:['常用名称在首页的常用数据中管理。','个人参赛记录从底部“记录”进入。'],records:['这里保留全部计分、计时记录。','“我的参赛”只查看明确属于本人身份的比赛。'],personal:['同一场比赛只算一次；身份重叠的旧记录暂不计入胜负。','需要补充本人名称时，前往“常用名称”。'],names:['最多关联 3 个名称；当前昵称的自动置顶项不额外占名额。','已关联名称直接在本页展开；其他选手名称的菜单里可以选择“关联为我”。','从选人列表移除只隐藏快捷入口，不释放名额；解除关联后才释放名额。','已有名称的新旧记录可继续补充。队伍名称不关联到个人。'],scan:['勾选名称，批量关联找到的旧记录，保留原始名称和比分。','最多关联 3 个名称；这些名称以后选用时都标记“我”。','后来导入的旧记录可以再次补充。'],setup:['带“我”的名称属于同一人，可以继续用其中任意一个参赛。','一场比赛同一人只能占一个位置；其他位置会禁选全部本人名称。','同位置可以换名字。重名球友可手动填写普通名称。'],me:['应用昵称在个人资料中修改。'],profile:['昵称用于应用内展示，不影响登录方式。','改昵称不改变已关联记录的身份。'],group:['本组昵称在本组的“我的设置”中修改。'],groupNick:['小组昵称仅在本组使用。','未单独设置时，跟随应用昵称。']};
      if(who()==='guest'&&['names','scan','setup','personal'].includes(state.page))help[state.page].push('未登录也能使用本机的我，之后登录会自动承接；超过名额或归属冲突时再处理，不丢弃记录。');
      html='<h2>说明</h2><ul class="help-list">'+help[state.page].map(text=>'<li>'+text+'</li>').join('')+'</ul><button type="button" class="primary cursor-interaction" data-modal-action="close">知道了</button>';
    }
    if(modal.kind==='name-limit')html='<h2>最多关联 3 个名称</h2><p>请先解除一个已有名称，再添加新的关联。</p><button type="button" class="primary cursor-interaction" data-modal-action="manage-names">返回常用名称</button><button type="button" class="secondary cursor-interaction" data-modal-action="close">取消</button>';
    if (modal.kind === 'transfer') {
      const localNames = Object.keys(state.links.guest), localIds = new Set(Object.values(state.links.guest).flat());
      const conflicts = localNames.some(name => ['a','b'].some(owner => owner !== who() && Object.hasOwn(state.links[owner],name)));
      const exceeds=!withinNameLimit(localNames);
      html = '<h2>本机身份待同步</h2><p>本机有 ' + localNames.length + ' 个关联名称，涉及 ' + localIds.size + ' 场旧记录。</p>' + (conflicts ? '<div class="callout amber">存在账号归属冲突，本机数据仍然保留。</div>' : exceeds?'<div class="callout amber">合并后超过 3 个名称，请先管理已有的关联。本机数据仍然保留。</div>':'<p class="fine">可继续同步到当前账号。</p>') + '<button type="button" class="primary cursor-interaction" data-modal-action="transfer" ' + (conflicts || exceeds || !localNames.length ? 'disabled' : '') + '>继续同步</button>'+(exceeds?'<button type="button" class="secondary cursor-interaction" data-modal-action="manage-names">前往常用名称</button>':'')+'<button type="button" class="secondary cursor-interaction" data-modal-action="close">稍后处理</button>';
    }
    q('[data-modal]').innerHTML = html;
    q('[data-modal]').setAttribute('aria-label', q('[data-modal] h2')?.textContent || '确认关联');
    root.querySelectorAll('[data-modal-action]').forEach(button => button.onclick = () => modalAction(button.dataset.modalAction));
    root.querySelectorAll('[data-guest-pick]').forEach(button=>button.onclick=()=>{const name=button.dataset.guestPick;if(Object.hasOwn(state.links.guest,name)){state.guestNameRef=name;state.modal=null;render();persist();}else if(withinNameLimit([name])&&!foreignBound(name)){state.selected=[name];openModal({kind:'confirm',chooseGuestName:name});}});
  }
  function modalAction(action) {
    if (action === 'close') return closeModal();
    if(action==='login-sync')return signInAndPromote();
    if (action === 'home') {if(state.stack.at(-1)==='names')return goBack();return navigate('names');}
    if(action==='manage-names')return navigate('names');
    if(action==='associate-common'||action==='supplement'){const name=state.modal.name;if(foreignBound(name))return;if(!withinNameLimit([name]))return openModal({kind:'name-limit'});state.selected=[name];return openModal({kind:'confirm'});}
    if(action==='ask-unlink')return openModal({kind:'unlink-confirm',name:state.modal.name});
    if(action==='toggle-picker'){const name=state.modal.name;const hidden=state.pickerHidden[who()];state.pickerHidden[who()]=hidden.includes(name)?hidden.filter(value=>value!==name):[...hidden,name];if(who()==='guest'&&state.guestNameRef===name&&!hidden.includes(name))state.guestNameRef=Object.keys(mine()).find(value=>!state.pickerHidden.guest.includes(value))||null;state.notice=hidden.includes(name)?'已显示在选人列表':'已从选人列表移除，记录关联保留';state.modal=null;render();persist();return;}
    if(action==='save-manual'){const value=q('.name-input').value.trim();if(!value)return;pickEntry({name:value,person:null,current:false});state.modal=null;render();persist();return;}
    if (action === 'apply') {
      state.selected = state.selected.filter(name => !foreignBound(name));
      if(!withinNameLimit(state.selected))return openModal({kind:'name-limit'});
      const s = selectionSummary(), names = [...state.selected];
      const preferred=state.modal?.chooseGuestName;
      if (!s.count&&names.every(name=>Object.hasOwn(mine(),name))) return closeModal();
      names.forEach(name => { mine()[name] = [...new Set([...(mine()[name] || []),...remaining(name).map(record => record.id)])]; state.pickerHidden[who()]=state.pickerHidden[who()].filter(value=>value!==name); });
      if(who()==='guest'){state.guestUsed=true;state.guestNameRef=preferred||state.guestNameRef||names[0]||null;}
      state.modal = { kind: 'success', count: s.count, names }; render(); persist(); return;
    }
    if (action === 'unlink') { const name = state.modal.name; delete mine()[name];if(who()==='guest'&&state.guestNameRef===name)state.guestNameRef=Object.keys(mine()).find(value=>!state.pickerHidden.guest.includes(value))||null;for(const slot of state.slots)if(!slot.current&&norm(slot.name)===norm(name)&&slot.person===who())slot.person=null;state.modal = null; state.notice = '已解除“' + name + '”的关联'; render(); persist(); return; }
    if (action === 'save-name') { const value = q('.name-input').value.trim(); if (!value) { q('.name-input').focus(); return; } state.accountNames[who()] = value; state.modal = null; render(); persist(); return; }
    if (action === 'transfer') {
      const result=promoteGuest();if(!result.ok)return openModal({kind:'transfer'});state.modal=null;state.page='names';config.screen=pageLabels.names;state.notice='本机的我已同步到当前账号';render();persist();
    }
  }
  q('[data-back]').onclick = goBack;
  q('[data-help]').onclick=()=>openModal({kind:'help'});
  root.addEventListener('keydown', event => {
    if (!state.modal) return;
    if (event.key === 'Escape') { event.preventDefault(); closeModal(); }
    if (event.key === 'Tab') {
      const elements = [...q('[data-modal]').querySelectorAll('button:not(:disabled),input')];
      const first = elements[0], last = elements[elements.length-1];
      if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last?.focus(); }
      else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first?.focus(); }
    }
  });
  restore(window.openai?.widgetState); render();
  window.addEventListener('openai:set_globals', event => { if (event.detail?.globals?.widgetState) { restore(event.detail.globals.widgetState); render(); } });
  if (globalThis.Tweak) {
    const tweak = new Tweak({ container: root, onChange: () => { if (activeAccount !== config.account) {const previousAccount=activeAccount;state.page='names';state.stack=['start'];config.screen=pageLabels.names;state.selected=[];state.modal=null;state.notice='';if(previousAccount==='未登录'&&who()!=='guest'){const result=promoteGuest();state.modal=result.ok?null:{kind:'transfer'};if(result.ok&&result.moved)state.notice='本机的我已同步到当前账号';}else state.slots.forEach(slot=>slot.person=null);activeAccount=config.account;}else{const page=Object.keys(pageLabels).find(value=>pageLabels[value]===config.screen)||'start';if(page!==state.page){state.page=page;state.stack=[];state.modal=null;state.selected=[];state.notice='';}}render(); persist(); } });
    tweak.addSelect(config,'screen',{label:'查看页面',options:Object.values(pageLabels)});
    tweak.addSelect(config, 'account', { label: '登录状态', options: ['杨杨','未登录','小林'] });
    tweak.addSelect(config, 'platform', { label: '界面示意', options: ['iOS','Android','鸿蒙','网页'] });
    tweak.addToggle(config, 'imported', { label: '后来又导入了旧记录' });
  }
})();
</script>
