#record-tab-options .rec-app[data-design="compact"],#record-tab-options .rec-app[data-design="empty"] { width:320px; }

<div id="record-tab-options" class="viz-carousel viz-dotted-background" aria-label="筛选状态与恢复" data-previous-label="上一场景" data-next-label="下一场景">
  <section data-variant="iOS · 筛选中" aria-label="iOS 筛选状态"><div class="rec-stage"><div class="rec-app" data-design="ios" aria-label="iOS 记录页交互"></div></div></section>
  <section data-variant="Android · 筛选中" aria-label="Android 筛选状态" hidden><div class="rec-stage"><div class="rec-app" data-design="android" aria-label="Android 记录页交互"></div></div></section>
  <section data-variant="窄屏 · 320px" aria-label="320px 窄屏多条件" hidden><div class="rec-stage"><div class="rec-app" data-design="compact" aria-label="320px Android 记录页交互"></div></div></section>
  <section data-variant="筛选后为空" aria-label="筛选无结果恢复" hidden><div class="rec-stage"><div class="rec-app" data-design="empty" aria-label="320px iOS 筛选空状态交互"></div></div></section>
</div>
<script>
(() => {
  const root=document.getElementById('record-tab-options');
  const scenarios=[{id:'ios',platform:'ios',filters:{type:'score',period:'month',sport:'badminton'}},{id:'android',platform:'android',filters:{type:'score',period:'month',sport:'badminton'}},{id:'compact',platform:'android',filters:{type:'timer',period:'month',sport:'custom'}},{id:'empty',platform:'ios',filters:{type:'timer',period:'today',sport:'custom'}}];
  const platforms=scenarios.map(value=>value.id);
  const data=[
    {id:'match-one',kind:'score',date:'2026.10.24',sport:'badminton',format:'单打',left:'杨杨',right:'小林',scores:[21,18],mine:true},
    {id:'timer-one',kind:'timer',date:'2026.10.23',sport:'custom',label:'自定义计时',duration:'15:00'},
    {id:'match-two',kind:'score',date:'2026.10.21',sport:'badminton',format:'单打',left:'小杨',right:'阿杰',scores:[18,21],mine:true},
    {id:'match-three',kind:'score',date:'2026.09.20',sport:'tabletennis',format:'单打',left:'陈晨',right:'李薇',scores:[11,8],mine:false}
  ];
  const typeLabels={all:'全部',score:'计分',timer:'计时'};
  const periodLabels={all:'全部时间',today:'今天',week:'本周',month:'本月'};
  const sportLabels={all:'全部项目',badminton:'羽毛球',tabletennis:'乒乓球',custom:'自定义计时'};
  const defaults=()=>({type:'all',period:'all',sport:'all'});
  const initial=()=>({scope:'all',filters:defaults(),personalFilters:{...defaults(),type:'score'},draft:null,search:false,query:'',allQuery:'',allSearch:false,menu:null,editing:false,selected:[],deleted:[]});
  const models=Object.fromEntries(scenarios.map(({id,filters})=>[id,{...initial(),filters:{...filters}}]));
  const esc=value=>String(value).replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
  const icon=name=>'<i data-lucide="'+name+'" aria-hidden="true"></i>';
  const appFor=id=>root.querySelector('[data-design="'+id+'"]');
  const applied=model=>model.scope==='mine'?model.personalFilters:model.filters;
  function filterSummary(filters,personal=false){return [!personal&&filters.type!=='all'?typeLabels[filters.type]:null,filters.period!=='all'?periodLabels[filters.period]:null,filters.sport!=='all'?sportLabels[filters.sport]:null].filter(Boolean).join(' · ');}
  function matches(record,filters){
    if(filters.type!=='all'&&record.kind!==filters.type)return false;
    if(filters.period==='today'&&record.date!=='2026.10.24')return false;
    if(filters.period==='week'&&record.date<'2026.10.19')return false;
    if(filters.period==='month'&&!record.date.startsWith('2026.10'))return false;
    return filters.sport==='all'||record.sport===filters.sport;
  }
  function records(model,ignoreQuery=false){
    const query=ignoreQuery?'':model.query.trim().toLowerCase();
    return data.filter(record=>!model.deleted.includes(record.id)&&(model.scope!=='mine'||record.mine)&&matches(record,applied(model))&&(!query||[record.left,record.right,sportLabels[record.sport],record.label].filter(Boolean).join(' ').toLowerCase().includes(query)));
  }
  function personalCount(model){return data.filter(record=>record.mine&&!model.deleted.includes(record.id)).length;}
  function toolbar(model){
    if(model.editing)return '<button type="button" class="rec-type cursor-interaction" data-action="done-edit">完成</button>';
    return '<button type="button" class="rec-icon cursor-interaction" data-action="search" aria-label="搜索记录" aria-expanded="'+model.search+'">'+icon('search')+'</button><button type="button" class="rec-icon cursor-interaction" data-action="more" aria-label="更多操作" aria-expanded="'+(model.menu==='more')+'">'+icon('ellipsis')+'</button>';
  }
  function header(model,id){
    const back=model.scope==='mine'?'<button type="button" class="rec-icon cursor-interaction" data-action="back" aria-label="返回记录">'+icon('chevron-left')+'</button>':'';
    const title=model.scope==='mine'?'我的参赛':'记录';
    return scenarios.find(value=>value.id===id).platform==='android'?'<header class="rec-nav is-left"><div class="rec-title-cluster '+(back?'has-back':'')+'">'+back+'<h1>'+title+'</h1></div><div class="rec-nav-right">'+toolbar(model)+'</div></header>':'<header class="rec-nav"><div class="rec-nav-left">'+back+'</div><h1>'+title+'</h1><div class="rec-nav-right">'+toolbar(model)+'</div></header>';
  }
  function row(record,model){
    const edit=model.editing?'<span class="rec-check">'+icon(model.selected.includes(record.id)?'square-check':'square')+'</span>':'';
    const meta=record.date+' · '+(record.kind==='timer'?'计时':sportLabels[record.sport]+' · '+record.format);
    const content=record.kind==='timer'?'<div class="rec-timer"><span>'+record.label+'</span><strong class="rec-score">'+record.duration+'</strong></div>':'<div class="rec-teams"><span>'+record.left+(record.mine?'<span class="rec-me">我</span>':'')+'</span><strong class="rec-score">'+record.scores.join(' : ')+'</strong><span>'+record.right+'</span></div>';
    return '<button type="button" class="rec-row cursor-interaction '+(model.selected.includes(record.id)?'is-selected':'')+'" data-row="'+record.id+'" '+(model.editing?'aria-pressed="'+model.selected.includes(record.id)+'"':'')+'><div class="rec-meta">'+edit+meta+'</div>'+content+'</button>';
  }
  function stats(model){const rows=records(model),wins=rows.filter(record=>record.scores[0]>record.scores[1]).length;return '<div class="rec-stats"><div><strong>'+rows.length+'</strong><span>参赛</span></div><div><strong>'+wins+'</strong><span>获胜</span></div><div><strong>'+(rows.length?Math.round(wins/rows.length*100)+'%':'—')+'</strong><span>胜率</span></div></div>';}
  function results(model){
    const rows=records(model),summary=filterSummary(applied(model),model.scope==='mine');
    const heading=model.query?'搜索结果':model.scope==='mine'?'参赛记录':'最近记录';
    const header=summary?'<div class="rec-heading is-filtered"><button type="button" class="rec-filter-status cursor-interaction" data-action="filters" aria-label="当前筛选：'+esc(summary)+'，'+rows.length+' 条记录，修改筛选">'+icon('sliders-horizontal')+'<span>'+esc(summary)+'</span>'+icon('chevron-down')+'</button><button type="button" class="rec-clear-filters cursor-interaction" data-action="clear-filters">清除筛选</button></div>':'<div class="rec-heading"><span>'+heading+'</span><span>'+rows.length+' 条</span></div>';
    let empty='';
    if(!rows.length){
      const message=summary?(model.query.trim()?'没有符合搜索及筛选条件的记录':'没有符合筛选条件的记录'):model.query.trim()?'没有找到相关记录':'暂无记录';
      const actions=(summary?'<button type="button" class="cursor-interaction" data-action="clear-filters">清除筛选</button>':'')+(model.query.trim()?'<button type="button" class="cursor-interaction" data-action="clear-query">清除搜索</button>':'');
      empty='<div class="rec-empty"><p>'+message+'</p>'+(actions?'<div class="rec-empty-actions">'+actions+'</div>':'')+'</div>';
    }
    return header+'<div class="rec-list" aria-label="'+rows.length+' 条记录">'+(rows.length?rows.map(record=>row(record,model)).join(''):empty)+'</div>';
  }
  function body(model){
    let html=model.search?'<div class="rec-search">'+icon('search')+'<input type="search" aria-label="搜索队伍或项目" placeholder="搜索队伍或项目" value="'+esc(model.query)+'"><button type="button" class="cursor-interaction" data-action="close-search" aria-label="关闭搜索">'+icon('x')+'</button></div>':'';
    if(model.editing)html+='<div class="rec-editbar"><button type="button" class="cursor-interaction" data-action="select-all">全选</button><span>已选 '+model.selected.length+' 条</span><button type="button" class="rec-danger cursor-interaction" data-action="delete-selected" '+(!model.selected.length?'disabled':'')+'>删除</button></div>';
    else if(model.scope==='mine')html+='<div data-stats>'+stats(model)+'</div>';
    else html+='<button type="button" class="rec-mine-entry cursor-interaction" data-action="mine">'+icon('user-round')+'<span>我的参赛</span><span class="rec-count">'+personalCount(model)+' 场</span>'+icon('chevron-right')+'</button>';
    return html+'<div data-results aria-live="polite">'+results(model)+'</div>';
  }
  function footer(model){return '<nav class="rec-footer" aria-label="应用导航" '+(model.scope==='mine'?'hidden':'')+'>'+[['首页','house'],['记录','clipboard-list'],['计分','circle-dot'],['计时','timer'],['我的','user-round']].map(([label,glyph])=>'<button type="button" class="cursor-interaction" '+(label==='记录'?'aria-current="page"':'disabled')+'>'+icon(glyph)+'<span>'+label+'</span></button>').join('')+'</nav>';}
  function field(label,key,options,draft,extra=''){return '<fieldset class="rec-filter-group"><legend>'+label+'</legend><div class="rec-filter-options '+extra+'">'+options.map(([value,text])=>'<button type="button" class="cursor-interaction" data-filter-key="'+key+'" data-filter-value="'+value+'" aria-pressed="'+(draft[key]===value)+'">'+text+'</button>').join('')+'</div></fieldset>';}
  function menu(model){
    if(!model.menu)return '';
    const cover='<button type="button" class="rec-cover cursor-interaction" data-action="close-menu" aria-label="关闭弹层"></button>';
    if(model.menu==='more')return cover+'<div class="rec-menu is-right" role="menu" aria-label="更多操作"><button type="button" class="rec-option cursor-interaction" role="menuitem" data-action="filters">'+icon('sliders-horizontal')+'<span>筛选</span></button><button type="button" class="rec-option cursor-interaction" role="menuitem" data-action="edit" '+(!records(model).length?'disabled':'')+'>'+icon('pencil')+'<span>编辑</span></button><button type="button" class="rec-option rec-danger cursor-interaction" role="menuitem" data-action="clear" '+(!data.some(row=>!model.deleted.includes(row.id))?'disabled':'')+'>'+icon('trash-2')+'<span>清空全部记录</span></button></div>';
    if(model.menu==='filters'){
      const draft=model.draft,personal=model.scope==='mine';
      const sports=Object.entries(sportLabels).filter(([value])=>value==='all'||(draft.type==='timer'?value==='custom':draft.type==='score'?value!=='custom':true));
      return cover+'<div class="rec-sheet-layer"><section class="rec-sheet" role="dialog" aria-modal="true" aria-label="筛选记录"><div class="rec-sheet-nav"><button type="button" class="cursor-interaction" data-action="close-menu">取消</button><h2>筛选</h2><button type="button" class="cursor-interaction" data-action="reset-filters">重置</button></div>'+(personal?'':field('记录类型','type',Object.entries(typeLabels),draft))+field('时间','period',Object.entries(periodLabels),draft,'is-time')+field('项目','sport',sports,draft,sports.length===4?'is-pairs':'')+'<button type="button" class="rec-primary cursor-interaction" data-action="apply-filters">应用</button></section></div>';
    }
    let dialog='';
    if(model.menu==='clear'||model.menu==='delete-selected')dialog='<h2>'+(model.menu==='clear'?'清空全部记录？':'删除选中的 '+model.selected.length+' 条记录？')+'</h2><button type="button" class="rec-primary cursor-interaction" data-action="confirm-delete">'+(model.menu==='clear'?'清空':'删除')+'</button><button type="button" class="rec-secondary cursor-interaction" data-action="close-menu">取消</button>';
    if(model.menu.startsWith('record:')){const record=data.find(row=>row.id===model.menu.slice(7));dialog='<h2>记录详情</h2><p>'+record.date+'<br>'+(record.kind==='timer'?record.label+' · '+record.duration:sportLabels[record.sport]+' · '+record.format+'<br>'+record.left+' '+record.scores.join(' : ')+' '+record.right)+'</p><button type="button" class="rec-primary cursor-interaction" data-action="close-menu">完成</button>';}
    return cover+'<div class="rec-dialog-layer"><section class="rec-dialog" role="dialog" aria-modal="true" aria-label="记录操作">'+dialog+'</section></div>';
  }
  function render(id){
    const app=appFor(id),model=models[id];
    app.innerHTML='<div class="rec-shell"><div class="rec-status"><span>9:41</span><span>'+icon('signal')+icon('wifi')+icon('battery-full')+'</span></div>'+header(model,id)+'<main class="rec-body">'+body(model)+'</main></div>'+footer(model)+'<div class="rec-homebar" aria-hidden="true"></div>'+menu(model);
    app.querySelector('.rec-shell').inert=!!model.menu;app.querySelector('.rec-footer').inert=!!model.menu;bind(app,id);
    if(globalThis.lucide)lucide.createIcons({attrs:{width:19,height:19}});
  }
  function save(id){if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{scenario:id,platform:scenarios.find(value=>value.id===id).platform,scope:models[id].scope,filters:applied(models[id]),search:models[id].query},privateContent:{filterStatusModels:models}}).catch(()=>{});}
  function cleanFilters(value,personal=false){return {type:personal?'score':Object.hasOwn(typeLabels,value?.type)?value.type:'all',period:Object.hasOwn(periodLabels,value?.period)?value.period:'all',sport:Object.hasOwn(sportLabels,value?.sport)?value.sport:'all'};}
  function restore(snapshot){
    const saved=snapshot?.privateContent?.filterStatusModels;if(!saved)return;
    for(const id of platforms){const value=saved[id];if(!value)continue;const model=models[id];model.scope=value.scope==='mine'?'mine':'all';model.filters=cleanFilters(value.filters);model.personalFilters=cleanFilters(value.personalFilters,true);model.search=value.search===true;model.query=typeof value.query==='string'?value.query.slice(0,80):'';model.allQuery=typeof value.allQuery==='string'?value.allQuery.slice(0,80):'';model.allSearch=value.allSearch===true;model.deleted=Array.isArray(value.deleted)?value.deleted.filter(key=>data.some(row=>row.id===key)):[];model.menu=null;model.draft=null;model.editing=false;model.selected=[];}
  }
  function act(id,action){
    const model=models[id];
    if(action==='more')model.menu='more';
    if(action==='close-menu'){model.menu=null;model.draft=null;}
    if(action==='filters'){model.draft={...applied(model)};model.menu='filters';}
    if(action==='reset-filters')model.draft={...defaults(),type:model.scope==='mine'?'score':'all'};
    if(action==='clear-filters'){if(model.scope==='mine')model.personalFilters={...defaults(),type:'score'};else model.filters=defaults();model.selected=[];model.menu=null;model.draft=null;}
    if(action==='clear-query')model.query='';
    if(action==='apply-filters'){if(model.scope==='mine')model.personalFilters={...model.draft};else model.filters={...model.draft};model.menu=null;model.draft=null;model.selected=[];}
    if(action==='search'){model.search=!model.search;if(!model.search)model.query='';}
    if(action==='close-search'){model.search=false;model.query='';}
    if(action==='mine'){model.allQuery=model.query;model.allSearch=model.search;model.scope='mine';model.query='';model.search=false;model.menu=null;}
    if(action==='back'){model.scope='all';model.query=model.allQuery;model.search=model.allSearch;model.menu=null;model.editing=false;model.selected=[];}
    if(action==='edit'){model.editing=true;model.search=false;model.query='';model.menu=null;model.selected=[];}
    if(action==='done-edit'){model.editing=false;model.selected=[];}
    if(action==='select-all'){const visible=records(model).map(row=>row.id);model.selected=visible.every(key=>model.selected.includes(key))?[]:visible;}
    if(action==='delete-selected')model.menu='delete-selected';
    if(action==='clear')model.menu='clear';
    if(action==='confirm-delete'){model.deleted=[...new Set([...model.deleted,...(model.menu==='clear'?data.map(row=>row.id):model.selected)])];model.selected=[];model.editing=false;model.menu=null;}
    render(id);save(id);
    const app=appFor(id);
    if(model.menu)app.querySelector('.rec-menu button,.rec-dialog button,.rec-sheet button')?.focus({preventScroll:true});
    if(action==='search'&&model.search)app.querySelector('input')?.focus({preventScroll:true});
    if(action==='back')app.querySelector('[data-action="mine"]')?.focus({preventScroll:true});
  }
  function bindRows(app,id){app.querySelectorAll('[data-row]').forEach(button=>button.onclick=()=>{const model=models[id],key=button.dataset.row;if(model.editing)model.selected=model.selected.includes(key)?model.selected.filter(value=>value!==key):[...model.selected,key];else model.menu='record:'+key;render(id);save(id);});}
  function bind(app,id){
    const model=models[id];
    app.querySelectorAll('[data-action]').forEach(button=>button.onclick=()=>act(id,button.dataset.action));
    app.querySelectorAll('[data-filter-key]').forEach(button=>button.onclick=()=>{const key=button.dataset.filterKey;model.draft[key]=button.dataset.filterValue;if(key==='type'&&((model.draft.type==='timer'&&!['all','custom'].includes(model.draft.sport))||(model.draft.type==='score'&&model.draft.sport==='custom')))model.draft.sport='all';render(id);app.querySelector('[data-filter-key="'+key+'"][data-filter-value="'+model.draft[key]+'"]')?.focus({preventScroll:true});save(id);});
    bindRows(app,id);
    const input=app.querySelector('input');
    if(input)input.oninput=()=>{model.query=input.value;app.querySelector('[data-results]').innerHTML=results(model);if(model.scope==='mine')app.querySelector('[data-stats]').innerHTML=stats(model);bindRows(app,id);app.querySelectorAll('[data-results] [data-action]').forEach(button=>button.onclick=()=>act(id,button.dataset.action));if(globalThis.lucide)lucide.createIcons({attrs:{width:19,height:19}});save(id);};
    app.onkeydown=event=>{if(event.key==='Escape'){if(model.menu){event.preventDefault();act(id,'close-menu');}else if(model.search){event.preventDefault();act(id,'close-search');}}if(event.key==='Tab'&&model.menu){const panel=app.querySelector('.rec-menu,.rec-dialog,.rec-sheet');const buttons=[...panel.querySelectorAll('button:not(:disabled)')];if(event.shiftKey&&document.activeElement===buttons[0]){event.preventDefault();buttons.at(-1)?.focus();}else if(!event.shiftKey&&document.activeElement===buttons.at(-1)){event.preventDefault();buttons[0]?.focus();}}};
  }
  restore(window.openai?.widgetState);platforms.forEach(render);
  window.addEventListener('openai:set_globals',event=>{const snapshot=event.detail?.globals?.widgetState;if(snapshot?.privateContent?.filterStatusModels&&JSON.stringify(snapshot.privateContent.filterStatusModels)!==JSON.stringify(models)){restore(snapshot);platforms.forEach(render);}});
})();
</script>
