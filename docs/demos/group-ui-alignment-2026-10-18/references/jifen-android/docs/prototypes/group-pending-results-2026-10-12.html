<header class="top"><div class="top-inner"><div><div class="eyebrow">全能计分器 / 小组</div><h1>待确认战绩<span class="prototype-status">交互原型</span></h1><p class="intro">先看清是谁，再核对比分。比较头像层次与作废入口。</p></div><div class="top-actions" id="tools"></div></div></header>
<div class="lab">
<label class="lab-label">查看身份<select id="role"><option value="manager">组主 / 管理员</option><option value="opponent">对方参赛者（丁）</option><option value="submitter">提交者（小林）</option><option value="member">其他普通成员</option></select></label>
<label class="lab-label">姓名样本<select id="sample"><option value="single">单打 · 单字姓名</option><option value="double">双打 · 四位成员</option><option value="long">双打 · 长名字</option></select></label>
<div class="lab-label"><span>头像样式</span><div id="avatar-options" class="avatar-options" role="group" aria-label="头像样式"></div></div>
<label class="check"><input id="archived" type="checkbox">小组已归档</label>
<label class="check"><input id="fail" type="checkbox">模拟一次提交失败</label>
</div>
<main class="workspace" id="workspace"></main>

function phone(v){const pending=results.filter(r=>r.status==='pending'),history=results.filter(r=>r.status!=='pending'),selected=variants[v],hasOverlay=state.overlay?.v===v;return '<div class="phone-wrap"><div class="phone-label"><strong>'+selected.letter+' · '+selected.title+'</strong>'+(v==='a'?'<span class="recommended">推荐</span>':'')+'</div><div class="phone '+(v==='current'?'':'avatar-'+state.avatar)+' '+(state.sample==='long'?'long-names':'')+'" data-v="'+v+'"><div class="phone-content" style="display:contents" '+(hasOverlay?'inert':'')+'><div class="status"><span>19:42</span><span class="status-right">'+icon('signal')+icon('battery')+'</span></div><div class="appnav">'+icon('back')+'<div><h2>周末羽毛球小组</h2><p class="group-caption">'+(state.archived?'已归档 · 仅可查看':'12 位成员 · '+({manager:'管理员视角',opponent:'对方参赛者视角',submitter:'提交者视角',member:'普通成员视角'}[state.role]))+'</p></div></div><div class="app-tabs" aria-label="当前页面：战绩"><span>概览</span><span>活动</span><span>成员</span><span class="selected">战绩</span></div><div class="phone-body"><div class="format"><span class="'+(state.sample==='single'?'on':'')+'">单打</span><span class="'+(state.sample!=='single'?'on':'')+'">双打</span></div><div class="section-heading"><h3>待确认战绩</h3><span>'+pending.length+' 条</span></div>'+(pending.length?pending.map(r=>card(r,v)).join(''):'<div class="empty-success">'+icon('check')+'没有待确认的战绩</div>')+ranking()+'<div class="section-heading"><h3>比赛记录</h3><span>全部 '+format()+'</span></div>'+(history.length?history.map(r=>card(r,v)).join(''):'<div class="empty">暂无已确认或已作废的战绩</div>')+'</div><div class="home"></div></div>'+overlay(v)+(state.toast?.v===v?'<div class="toast" role="status">'+esc(state.toast.text)+'</div>':'')+'</div></div>';}
function notes(){const v=variants[state.variant];return '<aside class="notes"><section class="note"><div class="note-label">'+v.intro+'</div><h2>'+v.letter+' · '+v.title+'</h2><p>'+v.description+'</p><ul>'+v.bullets.map(b=>'<li>'+b+'</li>').join('')+'</ul><div class="swatches"><span><i class="swatch"></i>现有卡片</span><span><i class="swatch"></i>现有默认头像</span></div><p class="source-note">当前布局固定使用原来的同底头像。A / B / C 可独立切换三种头像样式，避免把头像和按钮位置绑在一起。</p></section><section class="note rule-list"><div class="note-label">现有机制</div><h2>为什么可以作废？</h2>'+[['处理无效记录','比分录错、参赛者录错、重复提交时，需要留下原因并排除这条战绩。'],['只有组主 / 管理员能执行','小组须处于正常状态。普通参赛者可以确认对方提交的赛果，但不能作废；提交者不能自行确认。'],['保留记录，排除统计','待确认和已确认战绩都可作废。前者不再等待确认；后者从战绩和榜单中移除。原记录和原因仍可查看。'],['原因必填，对相关成员通知','原因最多 300 字，组内可见。服务端检查权限和记录版本；提交失败时保留原因，可重试。']].map((r,i)=>'<div class="rule-item"><span class="rule-number">'+(i+1)+'</span><div><strong>'+r[0]+'</strong><p>'+r[1]+'</p></div></div>').join('')+'<p class="source-note">本演示使用普通小组。训练组的确认权另受教练规则限制。关联活动 / 训练的战绩作废时，还会释放对应场次，具体状态随活动或计划状态变化。</p></section></aside>';}
function render(){const scroll=new Map([...document.querySelectorAll('.phone')].map(p=>[p.dataset.v,p.querySelector('.phone-body')?.scrollTop||0]));document.body.classList.toggle('dark',state.dark);document.body.classList.toggle('large',state.large);document.body.classList.toggle('compare',state.compare);document.documentElement.style.setProperty('--phone-width',state.narrow?'320px':'390px');$('#tools').innerHTML=[['compare',state.compare?'返回单方案':'并排比较三方案'],['narrow','320px'],['large','大字号'],['dark','深色']].map(([key,label])=>'<button type="button" class="tool" data-toggle="'+key+'" aria-pressed="'+state[key]+'">'+label+'</button>').join('')+'<button type="button" class="tool" data-act="reset">重置演示</button>';$('#avatar-options').innerHTML=Object.entries(avatarStyles).map(([key,label])=>'<button type="button" class="small-option" data-avatar="'+key+'" aria-pressed="'+String(state.avatar===key)+'">'+label+'</button>').join('');$('#role').value=state.role;$('#sample').value=state.sample;$('#archived').checked=state.archived;$('#fail').checked=state.fail;const sidebar='<nav class="sidebar" aria-label="战绩处理方案"><h2>作废入口方案</h2>'+Object.entries(variants).map(([key,v])=>'<button type="button" class="variant" data-variant="'+key+'" aria-pressed="'+String(state.variant===key)+'"><span class="letter">'+v.letter+'</span><span><strong>'+v.title+(key==='a'?'<span class="recommended">推荐</span>':'')+'</strong><small>'+v.short+'</small></span></button>').join('')+'<p class="sidebar-foot">试试点击确认、更多或比分有误。<br>切换身份可比较操作权限。<br><br>三个方案共享同一组示例数据；完成操作后，榜单和记录一起变化。</p></nav>';$('#workspace').innerHTML=sidebar+'<section class="stage" aria-label="手机界面演示">'+(state.compare?['a','b','c']:[state.variant]).map(phone).join('')+'</section>'+notes();document.querySelectorAll('.lab button,.lab input,.lab select,.top-actions button,.sidebar button').forEach(el=>{el.disabled=state.busy;});document.querySelectorAll('.phone').forEach(p=>{p.querySelector('.phone-body').scrollTop=scroll.get(p.dataset.v)||0;}); function announce(t){$('#announcements').textContent=t;}

async function submit(type,v,id){const r=record(id);if(!r||state.busy)return;if(type==='void'&&(!canVoid(r)||!state.reason.trim())||type==='confirm'&&!canConfirm(r))return;state.busy=true;state.error='';render();announce('正在提交');await new Promise(resolve=>setTimeout(resolve,500));state.busy=false;if(state.fail){state.fail=false;state.error=type==='void'?'提交失败，请检查网络后重试。填写的原因已保留。':'确认失败，请检查网络后重试。';render();focusDialog();announce('提交失败，原因已保留');return;}r.status=type==='void'?'voided':'confirmed';if(type==='void')r.reason=state.reason.trim();state.overlay=null;state.menu=null;state.toast={v,text:type==='void'?'已作废，原记录和原因已保留，不再计入榜单。':'已确认，双方战绩和榜单已更新。'};announce(state.toast.text);render();clearTimeout(toastTimer);toastTimer=setTimeout(()=>{state.toast=null;render();},4200);}
document.addEventListener('change',e=>{if(state.busy||!['role','sample','archived','fail'].includes(e.target.id))return;if(e.target.id==='role')state.role=e.target.value;if(e.target.id==='sample'){state.sample=e.target.value;resetRecords();}if(e.target.id==='archived')state.archived=e.target.checked;if(e.target.id==='fail')state.fail=e.target.checked;state.menu=null;state.overlay=null;render();});
document.addEventListener('input',e=>{if(e.target.matches('.reason-input')&&!state.busy){state.reason=e.target.value;state.error='';updateReason();}});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled||state.busy)return;const v=b.dataset.v,id=b.dataset.id,r=record(id);if(b.dataset.toggle){const key=b.dataset.toggle;state[key]=!state[key];state.overlay=null;state.menu=null;if(state.compare&&state.variant==='current')state.variant='a';render();return;}if(b.dataset.variant){state.variant=b.dataset.variant;state.overlay=null;state.menu=null;if(state.variant==='current')state.compare=false;render();return;}if(b.dataset.avatar){state.avatar=b.dataset.avatar;state.menu=null;render();return;}switch(b.dataset.act){case'reset':resetRecords();render();announce('示例数据已重置');break;case'menu':state.menu=state.menu?.id===id&&state.menu?.v===v?null:{v,id};render();if(state.menu)requestAnimationFrame(()=>document.querySelector('.phone[data-v="'+v+'"] .menu button')?.focus({preventScroll:true}));break;case'detail':open('detail',v,id);break;case'confirm':if(r&&canConfirm(r))open('confirm',v,id);break;case'void':if(r&&canVoid(r))open('void',v,id);break;case'anomaly':open('anomaly',v,id);break;case'close':close();break;case'back-detail':open('detail',v,id);break;case'reason':state.reason=b.dataset.reason;document.querySelector('.reason-input').value=state.reason;state.error='';updateReason();break;case'submit-void':submit('void',v,id);break;case'submit-confirm':submit('confirm',v,id);break;}});
document.addEventListener('click',e=>{if(state.busy)return;if(e.target.classList.contains('overlay'))close();if(state.menu&&!e.target.closest('.menu')&&!e.target.closest('[data-act="menu"]')){state.menu=null;render();}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(state.overlay)close();else if(state.menu){state.menu=null;render();}}if(e.key==='Tab'&&state.overlay){const enabled=[...document.querySelectorAll('.sheet button:not(:disabled),.sheet textarea:not(:disabled)')];const first=enabled[0],last=enabled.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus();}}});
resetRecords();render();
</script>
</body>
</html>
