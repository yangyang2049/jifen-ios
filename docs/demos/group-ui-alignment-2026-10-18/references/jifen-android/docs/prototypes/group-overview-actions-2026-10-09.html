 d:{title:'D · 邀请与记录操作拆分',lead:'推荐：邀请跟着群组走，计分与补记始终够得着。',description:'把邀请留在群组身份卡中，和二维码成为同一个入口。底部只放两条比赛记录路径：开始计分用绿色主按钮，补记赛果用次级按钮。',locations:['信息卡二维码下方','底部右侧主按钮','底部左侧次按钮'],tradeoff:'固定区会占一行高度，但两按钮比三按钮更从容。邀请不再始终常驻，仍可从信息卡或成员页进入。',summary:'兼顾操作层级、拇指可达和英文宽度。'}
};
const copy={
 en:{name:'Saturday badminton',tabs:['Overview','Activities','Records','Members'],invite:'Invite',start:'Start scoring',add:'Add result',confirmed:'Confirmed',month:'This month',active:'Active in 30d',upcoming:'Upcoming',latest:'Latest results',noActivities:'No activities yet',activityHint:'Start a match-up and the group gets notified — sign-up closes automatically when full',plan:'Plan a match',noResults:'No results yet',resultHint:'Start scoring or add a result after your match.',inviteTitle:'Invite members',inviteHint:'Share the group code with your teammates.',share:'Share invitation',formatTitle:'Start scoring',formatHint:'Choose a format to start a match for this group.',singles:'Singles',doubles:'Doubles',continue:'Continue',addTitle:'Add result',addHint:'Record a match that has already finished.',score:'Match score',save:'Save result',demoShare:'Invitation preview ready',demoStart:'Match setup · Demo',demoResult:'Result saved · Demo',copied:'Group code copied · Demo',recruiting:'Open for sign-up',activityTitle:'Saturday evening doubles',activityDate:'Oct 10 · 18:30–20:30 · Court 3',signed:'6 / 8 players',details:'View activity',confirmedChip:'Confirmed',date:'Oct 8 · Doubles',names:['Alex / Jamie','Sam / Taylor'],people:['Alex','Jamie','Sam','Taylor'],owner:'Owner',member:'Member',allActivities:'Group activities',allResults:'Match records',allMembers:'Group members',noMembers:'Invite your teammates',more:'Group management · Demo',back:'Return to groups · Demo',planned:'Activity planner · Demo',cancel:'Close'},
 zh:{name:'周六羽毛球小组',tabs:['概览','活动','战绩','成员'],invite:'邀请',start:'开始计分',add:'补记赛果',confirmed:'已确认',month:'本月场次',active:'30天活跃',upcoming:'即将开始',latest:'最新赛果',noActivities:'还没有活动',activityHint:'约一场比赛，组员会收到通知；名额满后自动截止报名。',plan:'去约一场',noResults:'还没有赛果',resultHint:'现场开始计分，或在比赛结束后补记赛果。',inviteTitle:'邀请队友',inviteHint:'将群组号分享给一起打球的朋友。',share:'分享邀请',formatTitle:'开始计分',formatHint:'选择比赛形式，为这个群组开始一场比赛。',singles:'单打',doubles:'双打',continue:'继续',addTitle:'补记赛果',addHint:'录入一场已经打完的比赛。',score:'比赛比分',save:'保存赛果',demoShare:'邀请内容已准备 · 演示',demoStart:'进入比赛设置 · 演示',demoResult:'赛果已保存 · 演示',copied:'已复制群组号 · 演示',recruiting:'报名中',activityTitle:'周六晚间双打',activityDate:'10月10日 · 18:30–20:30 · 3号场',signed:'6 / 8人已报名',details:'查看活动',confirmedChip:'已确认',date:'10月8日 · 双打',names:['小林 / 阿杰','阿明 / 小周'],people:['小林','阿杰','阿明','小周'],owner:'组主',member:'成员',allActivities:'群组活动',allResults:'比赛战绩',allMembers:'群组成员',noMembers:'邀请一起打球的朋友',more:'群组管理 · 演示',back:'返回群组列表 · 演示',planned:'进入活动创建 · 演示',cancel:'关闭'}
};
const t=()=>copy[state.language];
const icon=(name,extra='')=>`<svg class="icon ${extra}" aria-hidden="true"><use href="#i-${name}"/></svg>`;
function button(action,label,type='',className=''){return `<button class="action ${type} ${className}" data-action="${action}">${icon(action==='invite'?'share':action==='start'?'play':'edit')}<span>${label}</span></button>`;}
function qr(){
 if(typeof qrcode==='function'){const q=qrcode(0,'M');q.addData('Group layout demo / 6617 6540');q.make();return `<span class="qr-art" aria-hidden="true">${q.createSvgTag({cellSize:2,margin:2,scalable:true})}</span>`;}
 return `<span class="qr-art" aria-hidden="true" style="display:grid;place-items:center;background:#e5e8ed;font-weight:700">QR</span>`;
}
function hero(v){const c=t(),split=v==='c'||v==='d',filled=state.content==='filled';return `<div class="hero"><div class="hero-top"><img class="sport" src="group-overview-actions-assets/badminton.webp" alt=""><div class="group-meta"><h3 class="group-name">${c.name}</h3><button class="number" data-action="copy" aria-label="${c.copied}">6617 6540 ${icon('copy')}</button></div><button class="qr-action" data-action="invite" aria-label="${c.inviteTitle}">${qr()}${split?`<span class="invite-caption">${icon('share')}${c.invite}</span>`:''}</button></div><div class="stats"><div class="stat"><strong>${filled?'28':'0'}</strong><span>${c.confirmed}</span></div><div class="stat"><strong>${filled?'6':'0'}</strong><span>${c.month}</span></div><div class="stat"><strong>${filled?'12':'0'}</strong><span>${c.active}</span></div></div>${v==='a'?`<div class="hero-actions">${button('invite',c.invite)}${button('start',c.start,'primary')}${button('add',c.add)}</div>`:''}</div>`;}
function heading(title,tab,extra=''){return `<div class="section-heading"><button class="section-link" data-tab="${tab}">${title}</button>${extra}<button class="icon-button" data-tab="${tab}" aria-label="${title}">${icon('chevron')}</button></div>`;}
function emptyActivities(){const c=t();return `<div class="empty">${icon('court','court')}<strong>${c.noActivities}</strong><p>${c.activityHint}</p><button class="action primary" data-action="plan">${c.plan}</button></div>`;}
function emptyResults(){const c=t();return `<div class="empty results">${icon('court','court')}<strong>${c.noResults}</strong><p>${c.resultHint}</p></div>`;}
function activity(index=0){const c=t();return `<article class="activity-card"><span class="chip">${c.recruiting}</span><h3>${index?(state.language==='en'?'Sunday morning singles':'周日晨间单打'):c.activityTitle}</h3><p>${c.activityDate}</p><div class="activity-footer"><span>${c.signed}</span><button class="inline-action" data-action="activity">${c.details}${icon('chevron')}</button></div></article>`;}
function result(index=0){const c=t();return `<article class="result-card"><span class="chip">${c.confirmedChip}</span><div class="score-row"><span>${c.names[0]}</span><b>${index?'1 : 2':'2 : 1'}</b><span>${c.names[1]}</span></div><div class="record-meta"><span>${c.date}</span><span>21–18 / 16–21 / 21–15</span></div></article>`;}
function overview(v){const c=t();return `${hero(v)}<section class="section">${heading(c.upcoming,1)}${state.content==='empty'?emptyActivities():activity()}</section><section class="section">${heading(c.latest,2,v==='c'?`<button class="inline-action" data-action="add">${icon('edit')}${c.add}</button>`:'')}${state.content==='empty'?emptyResults():result()+result(1)+result()}</section>`;}
function tabContent(index){const c=t();if(index===1)return `<div class="tab-heading"><h3>${c.allActivities}</h3><button class="inline-action" data-action="plan">${c.plan}</button></div>${state.content==='empty'?emptyActivities():activity()+activity(1)+activity()}`;if(index===2)return `<div class="tab-heading"><h3>${c.allResults}</h3><button class="inline-action" data-action="add">${icon('edit')}${c.add}</button></div>${state.content==='empty'?emptyResults():result()+result(1)+result()+result(1)+result()}`;return `<div class="tab-heading"><h3>${c.allMembers}</h3><button class="inline-action" data-action="invite">${icon('share')}${c.invite}</button></div><div class="activity-card">${c.people.slice(0,state.content==='empty'?1:4).map((name,i)=>`<div class="member"><span class="avatar">${name.slice(0,1)}</span><div>${name}<small>${i?c.member:c.owner}</small></div>${!i?`<span class="chip">${c.owner}</span>`:''}</div>`).join('')}</div>`;}
function dock(v,index){const c=t();if(index!==0||v==='a')return '<div class="home-safe"></div>';const content=v==='b'?button('invite',c.invite,'outline')+button('start',c.start,'primary')+button('add',c.add,'outline'):v==='c'?button('start',c.start,'primary'):button('add',c.add,'outline')+button('start',c.start,'primary');return `<footer class="bottom-dock ${v==='b'?'triple':v==='c'?'single':'dual'}"><div class="dock-row">${content}</div><div class="home-safe"></div></footer>`;}
function phone(v){const c=t(),index=screens.get(v)||0;return `<div class="phone" data-phone="${v}" lang="${state.language==='en'?'en':'zh-CN'}" style="--phone-width:${state.width}px;--text-scale:${state.large?1.18:1}"><div class="status"><span>10:59</span><span class="camera" aria-hidden="true"></span><span class="status-icons" aria-hidden="true"><span class="signal"><i></i><i></i><i></i><i></i></span><span>⌁</span><span class="battery"></span></span></div><header class="appbar"><button class="icon-button" data-action="back" aria-label="${c.back}">${icon('back')}</button><h2>${c.name}</h2><button class="icon-button" data-action="more" aria-label="${c.more}">${icon('more')}</button></header><nav class="tabs" aria-label="${state.language==='en'?'Group sections':'群组页签'}">${c.tabs.map((name,i)=>`<button class="${index===i?'active':''}" data-tab="${i}" aria-current="${index===i?'page':'false'}">${name}</button>`).join('')}</nav><div class="scroll" tabindex="0" aria-label="${c.tabs[index]}">${index===0?overview(v):tabContent(index)}</div>${dock(v,index)}</div>`;}
function inspector(v){const o=variants[v];return `<aside class="inspector">${v==='d'?'<div class="variant-pill">我的推荐</div>':''}<h3>${o.lead}</h3><p>${o.description}</p><div class="mapping">${['邀请','开始计分','补记赛果'].map((label,i)=>`<div class="mapping-row"><b>${label}</b><span>${o.locations[i]}</span></div>`).join('')}</div><div class="tradeoff"><strong>需要接受的取舍</strong>${o.tradeoff}</div><div class="tradeoff"><strong>实际体验</strong>先向下滚动，再试着开始计分或补记赛果；也可以切到英文 + 320 窄屏 + 放大文案，观察按钮是否拥挤。</div></aside>`;}
function panel(v,compare){return `<article class="demo-panel" data-panel="${v}"><h2 class="panel-title">${variants[v].title}${v==='d'?'<span class="recommend-tag">推荐</span>':''}</h2>${phone(v)}${compare?`<div class="compare-summary"><b>${variants[v].summary}</b>${variants[v].tradeoff}</div>`:'<div class="scroll-tip">在手机区域内滚动，底栏位置会保持不变。</div>'}</article>`;}
function render(){const stage=document.querySelector('#stage'),compare=state.mode==='compare';stage.classList.toggle('compare',compare);stage.innerHTML=compare?Object.keys(variants).map(v=>panel(v,true)).join(''):panel(state.variant,false)+inspector(state.variant);document.querySelectorAll('[data-variant]').forEach(b=>{b.classList.toggle('on',b.dataset.variant===state.variant);b.setAttribute('aria-pressed',String(b.dataset.variant===state.variant));});document.querySelectorAll('[data-mode]').forEach(b=>{b.classList.toggle('on',b.dataset.mode===state.mode);b.setAttribute('aria-pressed',String(b.dataset.mode===state.mode));});}
function rerenderPhone(v){const old=document.querySelector(`[data-phone="${v}"]`);if(old)old.outerHTML=phone(v);}
function toast(phone,message){phone.querySelector('.toast')?.remove();const e=document.createElement('div');e.className='toast';e.setAttribute('role','status');e.textContent=message;phone.append(e);setTimeout(()=>e.remove(),2200);}
let returnFocus=null;
function closeModal(phone){phone.querySelector('.modal-shade')?.remove();phone.querySelectorAll('[data-modal-inert]').forEach(e=>{e.inert=false;delete e.dataset.modalInert;});if(returnFocus?.isConnected)returnFocus.focus();returnFocus=null;}
function modal(phone,type,trigger){const c=t();returnFocus=trigger;phone.querySelectorAll(':scope > *').forEach(e=>{e.inert=true;e.dataset.modalInert='';});const share=type==='invite',add=type==='add';const content=share?`${qr()}<button class="number" data-action="copy">6617 6540 ${icon('copy')}</button><button class="action primary" data-action="share">${icon('share')}${c.share}</button>`:add?`<label for="demo-score-${phone.dataset.phone}" style="display:block;font-size:.9em;margin-bottom:8px">${c.score}</label><input id="demo-score-${phone.dataset.phone}" value="2 : 1" style="width:100%;padding:13px;border:1px solid #d5dbe2;border-radius:10px;font:inherit"><button class="action primary" data-action="save">${c.save}</button>`:`<div class="format-choices"><button class="on" data-format="singles" aria-pressed="true">${c.singles}</button><button data-format="doubles" aria-pressed="false">${c.doubles}</button></div><button class="action primary" data-action="continue">${icon('play')}${c.continue}</button>`;const e=document.createElement('div');e.className='modal-shade';e.innerHTML=`<section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title-${phone.dataset.phone}"><button class="close" data-action="close" aria-label="${c.cancel}">×</button><h3 id="modal-title-${phone.dataset.phone}">${share?c.inviteTitle:add?c.addTitle:c.formatTitle}</h3><p>${share?c.inviteHint:add?c.addHint:c.formatHint}</p>${content}</section>`;phone.append(e);e.querySelector('.close').focus();}
document.addEventListener('click',event=>{const b=event.target.closest('button');if(!b){if(event.target.classList.contains('modal-shade'))closeModal(event.target.closest('.phone'));return;}if(b.dataset.variant){state.variant=b.dataset.variant;state.mode='single';render();return;}if(b.dataset.mode){state.mode=b.dataset.mode;render();return;}const p=b.closest('.phone');if(!p)return;const v=p.dataset.phone;if(b.dataset.tab!==undefined){screens.set(v,Number(b.dataset.tab));rerenderPhone(v);return;}if(b.dataset.format){b.parentElement.querySelectorAll('button').forEach(e=>{e.classList.toggle('on',e===b);e.setAttribute('aria-pressed',String(e===b));});return;}const a=b.dataset.action;if(['invite','start','add'].includes(a)){modal(p,a,b);return;}if(a==='close'){closeModal(p);return;}if(a==='copy'){toast(p,t().copied);return;}if(['share','save','continue'].includes(a)){closeModal(p);toast(p,t()[a==='share'?'demoShare':a==='save'?'demoResult':'demoStart']);return;}if(a==='plan'){toast(p,t().planned);return;}if(a==='activity'){toast(p,t().details+' · Demo');return;}if(a==='more'||a==='back')toast(p,t()[a]);});
document.addEventListener('keydown',e=>{const modalEl=document.querySelector('.modal-shade');if(!modalEl)return;if(e.key==='Escape'){closeModal(modalEl.closest('.phone'));return;}if(e.key==='Tab'){const nodes=[...modalEl.querySelectorAll('button,input')],first=nodes[0],last=nodes[nodes.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
document.querySelector('#language').addEventListener('change',e=>{state.language=e.target.value;render();});
document.querySelector('#content').addEventListener('change',e=>{state.content=e.target.value;render();});
document.querySelector('#width').addEventListener('change',e=>{state.width=Number(e.target.value);render();});
document.querySelector('#large').addEventListener('change',e=>{state.large=e.target.checked;render();});
render();
</script>
</body>
</html>
