<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="860" viewBox="0 0 1300 860" role="img" aria-labelledby="08-system-architecture-title"><title id="08-system-architecture-title">复用既有 API 单体，新增队伍领域与可重建投影</title><defs><marker id="08-system-architecture-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0 L9 4.5 L0 9Z" fill="#536878"/></marker><marker id="08-system-architecture-amber" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9Z" fill="#a16b23"/></marker></defs><style>text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;fill:#23323e}.diagram-title{font-size:22px;font-weight:600}.node-title{font-size:17px;font-weight:600}.node-body{font-size:15px}.edge-label{font-size:14px;fill:#4b5c69}.footer{font-size:14px;fill:#5b6a75}</style><rect width="100%" height="100%" fill="#fff"/><text x="35" y="32" class="diagram-title">复用既有 API 单体，新增队伍领域与可重建投影</text><polyline points="395,127 470,127" fill="none" stroke="#536878" stroke-width="1.7" stroke-linejoin="round"  marker-end="url(#08-system-architecture-arrow)"/><polyline points="830,127 905,127" fill="none" stroke="#536878" stroke-width="1.7" stroke-linejoin="round"  marker-end="url(#08-system-architecture-arrow)"/><polyline points="215,195 215,345" fill="none" stroke="#536878" stroke-width="1.7" stroke-linejoin="round"  marker-end="url(#08-system-architecture-arrow)"/><polyline points="650,195 650,345" fill="none" stroke="#536878" stroke-width="1.7" stroke-linejoin="round"  marker-end="url(#08-system-architecture-arrow)"/><polyline points="1085,195 1085,345" fill="none" stroke="#536878" stroke-width="1.7" stroke-linejoin="round"  marker-end="url(#08-system-architecture-arrow)"/><polyline points="395,417 470,417" fill="none" stroke="#536878" stroke-width="1.7" stroke-linejoin="round"  marker-end="url(#08-system-architecture-arrow)"/><polyline points="830,417 905,417" fill="none" stroke="#536878" stroke-width="1.7" stroke-linejoin="round"  marker-end="url(#08-system-architecture-arrow)"/><polyline points="215,490 215,650" fill="none" stroke="#536878" stroke-width="1.7" stroke-linejoin="round"  marker-end="url(#08-system-architecture-arrow)"/><polyline points="650,490 650,650" fill="none" stroke="#536878" stroke-width="1.7" stroke-linejoin="round"  marker-end="url(#08-system-architecture-arrow)"/><polyline points="1085,490 1085,650" fill="none" stroke="#536878" stroke-width="1.7" stroke-linejoin="round"  marker-end="url(#08-system-architecture-arrow)"/><g id="08-system-architecture-clients"><rect x="35" y="60" width="360" height="135" rx="11" fill="#f7f9fa" stroke="#ccd6dd" /><text class="node-title" x="52" y="89">各客户端</text><text class="node-body" x="52" y="124">iOS／Android／HarmonyOS</text><text class="node-body" x="52" y="147">网页、小程序、手表按能力接入</text></g><g id="08-system-architecture-api"><rect x="470" y="60" width="360" height="135" rx="11" fill="#edf7ef" stroke="#9fc9a9" /><text class="node-title" x="487" y="89">既有 Express API 进程</text><text class="node-body" x="487" y="124">账号鉴权、限流、审核、版本</text><text class="node-body" x="487" y="147">新增 teams 与 team-contests 路由</text></g><g id="08-system-architecture-pg"><rect x="905" y="60" width="360" height="135" rx="11" fill="#edf7ef" stroke="#9fc9a9" /><text class="node-title" x="922" y="89">PostgreSQL + Prisma</text><text class="node-body" x="922" y="124">单一根 schema 与版本化迁移</text><text class="node-body" x="922" y="147">队伍／身份／事实／审计／outbox</text></g><g id="08-system-architecture-local"><rect x="35" y="345" width="360" height="145" rx="11" fill="#f7f9fa" stroke="#ccd6dd" /><text class="node-title" x="52" y="374">本机仓库与待发队列</text><text class="node-body" x="52" y="409">稳定 UUID、来源 ID、账号作用域</text><text class="node-body" x="52" y="432">baseRevision、回执与 tombstone</text><text class="node-body" x="52" y="455">无网络仍可记分</text></g><g id="08-system-architecture-domain"><rect x="470" y="345" width="360" height="145" rx="11" fill="#f7f9fa" stroke="#ccd6dd" /><text class="node-title" x="487" y="374">队伍领域事务</text><text class="node-body" x="487" y="409">TeamAccess 与阵容分开</text><text class="node-body" x="487" y="432">认领、结果版本、确认、配额</text><text class="node-body" x="487" y="455">权限／身份写入不做盲目覆盖</text></g><g id="08-system-architecture-projector"><rect x="905" y="345" width="360" height="145" rx="11" fill="#f7f9fa" stroke="#ccd6dd" /><text class="node-title" x="922" y="374">事务 Outbox + 后台投影</text><text class="node-body" x="922" y="409">幂等消费、分区重算</text><text class="node-body" x="922" y="432">首期不增加消息中间件</text><text class="node-body" x="922" y="455">可对账、可重建</text></g><g id="08-system-architecture-legacy"><rect x="35" y="650" width="360" height="120" rx="11" fill="#f7f9fa" stroke="#ccd6dd" /><text class="node-title" x="52" y="679">旧名称与既有记录</text><text class="node-body" x="52" y="714">保留旧客户端读取与回放</text><text class="node-body" x="52" y="737">关联层增量扩展</text></g><g id="08-system-architecture-ws"><rect x="470" y="650" width="360" height="120" rx="11" fill="#f7f9fa" stroke="#ccd6dd" /><text class="node-title" x="487" y="679">WebSocket 资源失效通知</text><text class="node-body" x="487" y="714">只推 revision／失效信息</text><text class="node-body" x="487" y="737">客户端再走鉴权 API 拉取</text></g><g id="08-system-architecture-stats"><rect x="905" y="650" width="360" height="120" rx="11" fill="#f7f9fa" stroke="#ccd6dd" /><text class="node-title" x="922" y="679">统计读取 API</text><text class="node-body" x="922" y="714">权限、范围、metricVersion</text><text class="node-body" x="922" y="737">statsRevision 与数据覆盖率</text></g><g><rect x="404.05" y="91" width="55.9" height="23" rx="4" fill="#fff"/><text x="432" y="108" text-anchor="middle" class="edge-label">HTTPS</text></g><g><rect x="410" y="381" width="44" height="23" rx="4" fill="#fff"/><text x="432" y="398" text-anchor="middle" class="edge-label">同步</text></g><g><rect x="831" y="381" width="72" height="23" rx="4" fill="#fff"/><text x="867" y="398" text-anchor="middle" class="edge-label">业务事件</text></g><text class="footer" x="35" y="830">复用基础设施与设计原则；不把小组表、旧名称表或匿名同步 actor 直接当作队伍授权模型。</text></svg>