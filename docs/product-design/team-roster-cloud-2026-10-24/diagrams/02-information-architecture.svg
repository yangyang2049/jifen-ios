<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="840" viewBox="0 0 1220 840" role="img" aria-labelledby="02-information-architecture-title"><title id="02-information-architecture-title">名称管理与比赛记录各有位置</title><defs><marker id="02-information-architecture-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0 L9 4.5 L0 9Z" fill="#536878"/></marker><marker id="02-information-architecture-amber" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9Z" fill="#a16b23"/></marker></defs><style>text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;fill:#23323e}.diagram-title{font-size:22px;font-weight:600}.node-title{font-size:17px;font-weight:600}.node-body{font-size:15px}.edge-label{font-size:14px;fill:#4b5c69}.footer{font-size:14px;fill:#5b6a75}</style><rect width="100%" height="100%" fill="#fff"/><text x="35" y="32" class="diagram-title">名称管理与比赛记录各有位置</text><polyline points="375,110 440,110" fill="none" stroke="#536878" stroke-width="1.7" stroke-linejoin="round"  marker-end="url(#02-information-architecture-arrow)"/><polyline points="780,110 845,110" fill="none" stroke="#536878" stroke-width="1.7" stroke-linejoin="round"  marker-end="url(#02-information-architecture-arrow)"/><polyline points="610,160 610,245" fill="none" stroke="#536878" stroke-width="1.7" stroke-linejoin="round"  marker-end="url(#02-information-architecture-arrow)"/><polyline points="1015,160 1015,245" fill="none" stroke="#536878" stroke-width="1.7" stroke-linejoin="round"  marker-end="url(#02-information-architecture-arrow)"/><polyline points="375,300 440,300" fill="none" stroke="#536878" stroke-width="1.7" stroke-linejoin="round"  marker-end="url(#02-information-architecture-arrow)"/><polyline points="375,515 440,515" fill="none" stroke="#536878" stroke-width="1.7" stroke-linejoin="round"  marker-end="url(#02-information-architecture-arrow)"/><polyline points="1015,370 1015,465" fill="none" stroke="#536878" stroke-width="1.7" stroke-linejoin="round"  marker-end="url(#02-information-architecture-arrow)"/><polyline points="780,710 812,710 812,110 845,110" fill="none" stroke="#536878" stroke-width="1.7" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#02-information-architecture-arrow)"/><g id="02-information-architecture-home"><rect x="35" y="65" width="340" height="95" rx="11" fill="#edf7ef" stroke="#9fc9a9" /><text class="node-title" x="52" y="94">首页</text><text class="node-body" x="52" y="129">队伍与队员入口</text></g><g id="02-information-architecture-library"><rect x="440" y="65" width="340" height="95" rx="11" fill="#edf7ef" stroke="#9fc9a9" /><text class="node-title" x="457" y="94">队伍与队员</text><text class="node-body" x="457" y="129">队伍／队员两类；本机与云状态</text></g><g id="02-information-architecture-team"><rect x="845" y="65" width="340" height="95" rx="11" fill="#f7f9fa" stroke="#ccd6dd" /><text class="node-title" x="862" y="94">队伍详情</text><text class="node-body" x="862" y="129">队员 ｜ 比赛 ｜ 统计</text></g><g id="02-information-architecture-aliases"><rect x="440" y="245" width="340" height="125" rx="11" fill="#f7f9fa" stroke="#ccd6dd" /><text class="node-title" x="457" y="274">队员页：已关联本人 3／3</text><text class="node-body" x="457" y="309">名字直接展开；显示“我”</text><text class="node-body" x="457" y="332">隐藏快捷入口与解除关联分开</text></g><g id="02-information-architecture-setup"><rect x="35" y="245" width="340" height="125" rx="11" fill="#f7f9fa" stroke="#ccd6dd" /><text class="node-title" x="52" y="274">Setup 计分设置</text><text class="node-body" x="52" y="309">选已有队伍，再选本场出场者</text><text class="node-body" x="52" y="332">同一身份不可重复占位</text></g><g id="02-information-architecture-nickname"><rect x="845" y="245" width="340" height="125" rx="11" fill="#f7f9fa" stroke="#ccd6dd" /><text class="node-title" x="862" y="274">队伍设置／本人队员资料</text><text class="node-body" x="862" y="309">队内昵称、邀请、认领、权限</text><text class="node-body" x="862" y="332">昵称仅在本队生效</text></g><g id="02-information-architecture-records"><rect x="35" y="465" width="340" height="100" rx="11" fill="#edf7ef" stroke="#9fc9a9" /><text class="node-title" x="52" y="494">记录 Tab</text><text class="node-body" x="52" y="529">保留全部／计分／计时分类</text></g><g id="02-information-architecture-personal"><rect x="440" y="465" width="340" height="100" rx="11" fill="#f7f9fa" stroke="#ccd6dd" /><text class="node-title" x="457" y="494">我的参赛</text><text class="node-body" x="457" y="529">本人比赛与统计；不混入名称管理</text></g><g id="02-information-architecture-ranking"><rect x="845" y="465" width="340" height="100" rx="11" fill="#f7f9fa" stroke="#ccd6dd" /><text class="node-title" x="862" y="494">统计／战绩榜</text><text class="node-body" x="862" y="529">队伍或赛事范围；不默认全站榜</text></g><g id="02-information-architecture-profile"><rect x="35" y="660" width="340" height="100" rx="11" fill="#f7f9fa" stroke="#ccd6dd" /><text class="node-title" x="52" y="689">我的 → 个人资料</text><text class="node-body" x="52" y="724">应用昵称与账号</text></g><g id="02-information-architecture-group"><rect x="440" y="660" width="340" height="100" rx="11" fill="#f0f3f6" stroke="#ccd6dd" stroke-dasharray="5 4"/><text class="node-title" x="457" y="689">小组赛事（按项目开放）</text><text class="node-body" x="457" y="724">队伍报名、引用与赛事确认</text></g><g><rect x="370" y="263" width="72" height="23" rx="4" fill="#fff"/><text x="406" y="280" text-anchor="middle" class="edge-label">快速选择</text></g><text class="footer" x="35" y="810">保留已有导航语义：名字和队伍在资料入口维护；比赛在记录里查看；队内昵称在队伍内设置。</text></svg>