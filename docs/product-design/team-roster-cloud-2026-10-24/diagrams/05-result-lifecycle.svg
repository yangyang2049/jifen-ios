<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="690" viewBox="0 0 1240 690" role="img" aria-labelledby="05-result-lifecycle-title"><title id="05-result-lifecycle-title">比分有版本，接受必须指向同一版本</title><defs><marker id="05-result-lifecycle-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0 L9 4.5 L0 9Z" fill="#536878"/></marker><marker id="05-result-lifecycle-amber" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9Z" fill="#a16b23"/></marker></defs><style>text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;fill:#23323e}.diagram-title{font-size:22px;font-weight:600}.node-title{font-size:17px;font-weight:600}.node-body{font-size:15px}.edge-label{font-size:14px;fill:#4b5c69}.footer{font-size:14px;fill:#5b6a75}</style><rect width="100%" height="100%" fill="#fff"/><text x="35" y="32" class="diagram-title">比分有版本，接受必须指向同一版本</text><polyline points="285,128 340,128" fill="none" stroke="#536878" stroke-width="1.7" stroke-linejoin="round"  marker-end="url(#05-result-lifecycle-arrow)"/><polyline points="590,128 645,128" fill="none" stroke="#536878" stroke-width="1.7" stroke-linejoin="round"  marker-end="url(#05-result-lifecycle-arrow)"/><polyline points="895,128 950,128" fill="none" stroke="#536878" stroke-width="1.7" stroke-linejoin="round"  marker-end="url(#05-result-lifecycle-arrow)"/><polyline points="1075,190 1075,270 770,270 770,340" fill="none" stroke="#536878" stroke-width="1.7" stroke-linejoin="round"  marker-end="url(#05-result-lifecycle-arrow)"/><polyline points="770,340 770,190" fill="none" stroke="#536878" stroke-width="1.7" stroke-linejoin="round"  marker-end="url(#05-result-lifecycle-arrow)"/><polyline points="1075,340 1075,190" fill="none" stroke="#536878" stroke-width="1.7" stroke-linejoin="round"  marker-end="url(#05-result-lifecycle-arrow)"/><polyline points="465,190 465,340" fill="none" stroke="#536878" stroke-width="1.7" stroke-linejoin="round"  marker-end="url(#05-result-lifecycle-arrow)"/><polyline points="365,190 365,245 190,245 190,340" fill="none" stroke="#a16b23" stroke-width="1.7" stroke-linejoin="round"  marker-end="url(#05-result-lifecycle-amber)"/><polyline points="285,410 340,410" fill="none" stroke="#536878" stroke-width="1.7" stroke-linejoin="round"  marker-end="url(#05-result-lifecycle-arrow)"/><polyline points="645,410 590,410" fill="none" stroke="#536878" stroke-width="1.7" stroke-linejoin="round"  marker-end="url(#05-result-lifecycle-arrow)"/><g id="05-result-lifecycle-draft"><rect x="35" y="65" width="250" height="125" rx="11" fill="#f7f9fa" stroke="#ccd6dd" /><text class="node-title" x="52" y="94">草稿／计分中</text><text class="node-body" x="52" y="129">保留会话与阵容来源 ID</text><text class="node-body" x="52" y="152">可离线继续</text></g><g id="05-result-lifecycle-recorded"><rect x="340" y="65" width="250" height="125" rx="11" fill="#edf7ef" stroke="#9fc9a9" /><text class="node-title" x="357" y="94">结果 r3 已记录</text><text class="node-body" x="357" y="129">最终比分与阵容快照</text><text class="node-body" x="357" y="152">云保存完成不自动确认</text></g><g id="05-result-lifecycle-one"><rect x="645" y="65" width="250" height="125" rx="11" fill="#f7f9fa" stroke="#ccd6dd" /><text class="node-title" x="662" y="94">本队接受 r3</text><text class="node-body" x="662" y="129">只代表本队</text><text class="node-body" x="662" y="152">可进入本队记录口径</text></g><g id="05-result-lifecycle-both"><rect x="950" y="65" width="250" height="125" rx="11" fill="#edf7ef" stroke="#9fc9a9" /><text class="node-title" x="967" y="94">双方接受 r3</text><text class="node-body" x="967" y="129">接受者须有对应队伍权限</text><text class="node-body" x="967" y="152">可进入双方确认口径</text></g><g id="05-result-lifecycle-revision"><rect x="645" y="340" width="250" height="145" rx="11" fill="#fcf5e9" stroke="#d9bb8f" /><text class="node-title" x="662" y="369">修订为结果 r4</text><text class="node-body" x="662" y="404">比分／阵容等事实发生变化</text><text class="node-body" x="662" y="427">旧版本保留</text><text class="node-body" x="662" y="450">对新版本重新接受</text></g><g id="05-result-lifecycle-disputed"><rect x="950" y="340" width="250" height="145" rx="11" fill="#f7f9fa" stroke="#ccd6dd" /><text class="node-title" x="967" y="369">未接受／有异议</text><text class="node-body" x="967" y="404">不进入要求双方确认的榜</text><text class="node-body" x="967" y="427">按当前有效版本处理</text></g><g id="05-result-lifecycle-void"><rect x="35" y="340" width="250" height="145" rx="11" fill="#fcf5e9" stroke="#d9bb8f" /><text class="node-title" x="52" y="369">作废</text><text class="node-body" x="52" y="404">记录原因与操作审计</text><text class="node-body" x="52" y="427">投影撤回该结果的贡献</text><text class="node-body" x="52" y="450">不物理删除历史事实</text></g><g id="05-result-lifecycle-stats"><rect x="340" y="340" width="250" height="145" rx="11" fill="#f7f9fa" stroke="#ccd6dd" /><text class="node-title" x="357" y="369">统计更新</text><text class="node-body" x="357" y="404">按范围与可信等级重算</text><text class="node-body" x="357" y="427">输出 statsRevision 与覆盖</text><text class="node-body" x="357" y="450">率</text></g><g><rect x="870" y="234" width="100" height="23" rx="4" fill="#fff"/><text x="920" y="251" text-anchor="middle" class="edge-label">改比分或阵容</text></g><g><rect x="778.03" y="277" width="95.94" height="23" rx="4" fill="#fff"/><text x="826" y="294" text-anchor="middle" class="edge-label">r4 重新接受</text></g><g><rect x="1092" y="273" width="86" height="23" rx="4" fill="#fff"/><text x="1135" y="290" text-anchor="middle" class="edge-label">仅当前版本</text></g><g><rect x="209" y="273" width="72" height="23" rx="4" fill="#fff"/><text x="245" y="290" text-anchor="middle" class="edge-label">作废请求</text></g><g><rect x="276" y="373" width="72" height="23" rx="4" fill="#fff"/><text x="312" y="390" text-anchor="middle" class="edge-label">撤回贡献</text></g><g><rect x="595" y="373" width="44" height="23" rx="4" fill="#fff"/><text x="617" y="390" text-anchor="middle" class="edge-label">重算</text></g><text class="footer" x="35" y="660">同步维度、结果事实与各方接受分开存储；r3 的确认绝不自动套到 r4。</text></svg>