<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="920" viewBox="0 0 1240 920" role="img" aria-labelledby="04-member-claim-sequence-title"><title id="04-member-claim-sequence-title">认领保留原队员身份，双方动作均留痕</title><defs><marker id="04-member-claim-sequence-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0 L9 4.5 L0 9Z" fill="#536878"/></marker><marker id="04-member-claim-sequence-amber" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9Z" fill="#a16b23"/></marker></defs><style>text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;fill:#23323e}.diagram-title{font-size:22px;font-weight:600}.node-title{font-size:17px;font-weight:600}.node-body{font-size:15px}.edge-label{font-size:14px;fill:#4b5c69}.footer{font-size:14px;fill:#5b6a75}</style><rect width="100%" height="100%" fill="#fff"/><text x="35" y="32" class="diagram-title">认领保留原队员身份，双方动作均留痕</text><rect x="35" y="58" width="210" height="42" rx="8" fill="#f3f6f8" stroke="#c9d5dd"/><text class="node-title" x="140" y="85" text-anchor="middle">队伍管理方</text><line x1="140" y1="103" x2="140" y2="845" stroke="#b8c6ce" stroke-dasharray="5 5"/><rect x="355" y="58" width="210" height="42" rx="8" fill="#f3f6f8" stroke="#c9d5dd"/><text class="node-title" x="460" y="85" text-anchor="middle">受邀者本人</text><line x1="460" y1="103" x2="460" y2="845" stroke="#b8c6ce" stroke-dasharray="5 5"/><rect x="675" y="58" width="210" height="42" rx="8" fill="#edf7ef" stroke="#c9d5dd"/><text class="node-title" x="780" y="85" text-anchor="middle">队伍 API</text><line x1="780" y1="103" x2="780" y2="845" stroke="#b8c6ce" stroke-dasharray="5 5"/><rect x="995" y="58" width="210" height="42" rx="8" fill="#f3f6f8" stroke="#c9d5dd"/><text class="node-title" x="1100" y="85" text-anchor="middle">数据库事务</text><line x1="1100" y1="103" x2="1100" y2="845" stroke="#b8c6ce" stroke-dasharray="5 5"/><rect x="660" y="526" width="570" height="147" rx="8" fill="#edf7ef" fill-opacity=".7" stroke="#b3d3bc"/><line x1="140" y1="142" x2="780" y2="142" stroke="#536878" stroke-width="1.6"  marker-end="url(#04-member-claim-sequence-arrow)"/><g><rect x="363.03" y="113" width="193.94" height="23" rx="4" fill="#fff"/><text x="460" y="130" text-anchor="middle" class="edge-label">1. 创建指定队员的认领邀请</text></g><line x1="780" y1="196" x2="1100" y2="196" stroke="#536878" stroke-width="1.6"  marker-end="url(#04-member-claim-sequence-arrow)"/><g><rect x="803.1300000000001" y="167" width="273.7399999999999" height="23" rx="4" fill="#fff"/><text x="940" y="184" text-anchor="middle" class="edge-label">2. 保存用途、目标、token hash、期限</text></g><line x1="780" y1="250" x2="140" y2="250" stroke="#536878" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#04-member-claim-sequence-arrow)"/><g><rect x="377.03" y="221" width="165.94" height="23" rx="4" fill="#fff"/><text x="460" y="238" text-anchor="middle" class="edge-label">3. 返回可撤销邀请链接</text></g><line x1="140" y1="304" x2="460" y2="304" stroke="#536878" stroke-width="1.6"  marker-end="url(#04-member-claim-sequence-arrow)"/><g><rect x="189.03" y="275" width="221.94" height="23" rx="4" fill="#fff"/><text x="300" y="292" text-anchor="middle" class="edge-label">4. 分享邀请（不直接授予身份）</text></g><line x1="460" y1="358" x2="780" y2="358" stroke="#536878" stroke-width="1.6"  marker-end="url(#04-member-claim-sequence-arrow)"/><g><rect x="537.03" y="329" width="165.94" height="23" rx="4" fill="#fff"/><text x="620" y="346" text-anchor="middle" class="edge-label">5. 登录并明确同意认领</text></g><line x1="780" y1="412" x2="1100" y2="412" stroke="#536878" stroke-width="1.6"  marker-end="url(#04-member-claim-sequence-arrow)"/><g><rect x="842.12" y="383" width="195.76000000000002" height="23" rx="4" fill="#fff"/><text x="940" y="400" text-anchor="middle" class="edge-label">6. 建立 pending 认领申请</text></g><line x1="780" y1="466" x2="140" y2="466" stroke="#536878" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#04-member-claim-sequence-arrow)"/><g><rect x="377.03" y="437" width="165.94" height="23" rx="4" fill="#fff"/><text x="460" y="454" text-anchor="middle" class="edge-label">7. 通知管理方核对队员</text></g><line x1="140" y1="520" x2="780" y2="520" stroke="#536878" stroke-width="1.6"  marker-end="url(#04-member-claim-sequence-arrow)"/><g><rect x="377.03" y="491" width="165.94" height="23" rx="4" fill="#fff"/><text x="460" y="508" text-anchor="middle" class="edge-label">8. 批准指定申请与版本</text></g><line x1="780" y1="574" x2="1100" y2="574" stroke="#536878" stroke-width="1.6"  marker-end="url(#04-member-claim-sequence-arrow)"/><g><rect x="822.03" y="545" width="235.94" height="23" rx="4" fill="#fff"/><text x="940" y="562" text-anchor="middle" class="edge-label">9. 锁队伍／队员／申请，重查权限</text></g><line x1="780" y1="628" x2="1100" y2="628" stroke="#536878" stroke-width="1.6"  marker-end="url(#04-member-claim-sequence-arrow)"/><g><rect x="789.13" y="599" width="301.74" height="23" rx="4" fill="#fff"/><text x="940" y="616" text-anchor="middle" class="edge-label">10. 绑定原 memberId，写最小访问权与审计</text></g><line x1="1100" y1="682" x2="780" y2="682" stroke="#536878" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#04-member-claim-sequence-arrow)"/><g><rect x="839.04" y="653" width="201.92000000000002" height="23" rx="4" fill="#fff"/><text x="940" y="670" text-anchor="middle" class="edge-label">11. 一次提交成功或明确冲突</text></g><line x1="780" y1="736" x2="460" y2="736" stroke="#536878" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#04-member-claim-sequence-arrow)"/><g><rect x="505.03999999999996" y="707" width="229.92000000000002" height="23" rx="4" fill="#fff"/><text x="620" y="724" text-anchor="middle" class="edge-label">12. 返回认领结果，接上原有历史</text></g><line x1="780" y1="790" x2="140" y2="790" stroke="#536878" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#04-member-claim-sequence-arrow)"/><g><rect x="359.03999999999996" y="761" width="201.92000000000002" height="23" rx="4" fill="#fff"/><text x="460" y="778" text-anchor="middle" class="edge-label">13. 刷新成员状态与资源版本</text></g><text x="35" y="893" class="footer">并发只允许一人认领；已有另一条成员身份时不自动合并；认领球员不授予管理员。</text></svg>