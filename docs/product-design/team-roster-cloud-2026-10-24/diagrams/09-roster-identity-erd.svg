<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="760" viewBox="0 0 1260 760" role="img" aria-labelledby="09-roster-identity-erd-title"><title id="09-roster-identity-erd-title">访问权、球员身份与认领记录分别建模</title><defs><marker id="09-roster-identity-erd-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0 L9 4.5 L0 9Z" fill="#536878"/></marker><marker id="09-roster-identity-erd-amber" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9Z" fill="#a16b23"/></marker></defs><style>text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;fill:#23323e}.diagram-title{font-size:22px;font-weight:600}.node-title{font-size:17px;font-weight:600}.node-body{font-size:15px}.edge-label{font-size:14px;fill:#4b5c69}.footer{font-size:14px;fill:#5b6a75}</style><rect width="100%" height="100%" fill="#fff"/><text x="35" y="32" class="diagram-title">访问权、球员身份与认领记录分别建模</text><polyline points="385,165 455,165" fill="none" stroke="#536878" stroke-width="1.7" stroke-linejoin="round"  marker-end="url(#09-roster-identity-erd-arrow)"/><polyline points="805,165 875,165" fill="none" stroke="#536878" stroke-width="1.7" stroke-linejoin="round"  marker-end="url(#09-roster-identity-erd-arrow)"/><polyline points="210,275 210,425" fill="none" stroke="#536878" stroke-width="1.7" stroke-linejoin="round"  marker-end="url(#09-roster-identity-erd-arrow)"/><polyline points="1050,275 1050,425" fill="none" stroke="#536878" stroke-width="1.7" stroke-linejoin="round"  marker-end="url(#09-roster-identity-erd-arrow)"/><polyline points="805,530 875,530" fill="none" stroke="#536878" stroke-width="1.7" stroke-linejoin="round"  marker-end="url(#09-roster-identity-erd-arrow)"/><polyline points="1050,635 1050,690 210,690 210,635" fill="none" stroke="#536878" stroke-width="1.7" stroke-linejoin="round"  marker-end="url(#09-roster-identity-erd-arrow)"/><g id="09-roster-identity-erd-team"><rect x="35" y="65" width="350" height="210" rx="11" fill="#edf7ef" stroke="#9fc9a9" /><text class="node-title" x="52" y="94">Team</text><text class="node-body" x="52" y="129">id · ownerUserId · sport</text><text class="node-body" x="52" y="152">name · status · revision</text><text class="node-body" x="52" y="175">队伍独立聚合</text></g><g id="09-roster-identity-erd-access"><rect x="455" y="65" width="350" height="210" rx="11" fill="#f7f9fa" stroke="#ccd6dd" /><text class="node-title" x="472" y="94">TeamAccess</text><text class="node-body" x="472" y="129">teamId + userId 唯一</text><text class="node-body" x="472" y="152">role · status · revision</text><text class="node-body" x="472" y="175">管理员／记分员不必是球员</text></g><g id="09-roster-identity-erd-user"><rect x="875" y="65" width="350" height="210" rx="11" fill="#f7f9fa" stroke="#ccd6dd" /><text class="node-title" x="892" y="94">User（已有）</text><text class="node-body" x="892" y="129">账号身份、应用昵称</text><text class="node-body" x="892" y="152">鉴权与账号生命周期</text><text class="node-body" x="892" y="175">userId 本身不授予队伍权限</text></g><g id="09-roster-identity-erd-member"><rect x="35" y="425" width="350" height="210" rx="11" fill="#edf7ef" stroke="#9fc9a9" /><text class="node-title" x="52" y="454">TeamMember</text><text class="node-body" x="52" y="489">id · teamId · userId?</text><text class="node-body" x="52" y="512">recordedName · nicknameOverride?</text><text class="node-body" x="52" y="535">rosterStatus · revision</text><text class="node-body" x="52" y="558">历史 memberId 不随认领改变</text></g><g id="09-roster-identity-erd-invite"><rect x="455" y="425" width="350" height="210" rx="11" fill="#f7f9fa" stroke="#ccd6dd" /><text class="node-title" x="472" y="454">TeamInvite</text><text class="node-body" x="472" y="489">teamId · targetMemberId?</text><text class="node-body" x="472" y="512">purpose = join / claim</text><text class="node-body" x="472" y="535">tokenHash · expiresAt · status</text><text class="node-body" x="472" y="558">不保存原始邀请 token</text></g><g id="09-roster-identity-erd-claim"><rect x="875" y="425" width="350" height="210" rx="11" fill="#f7f9fa" stroke="#ccd6dd" /><text class="node-title" x="892" y="454">TeamClaim</text><text class="node-body" x="892" y="489">inviteId · targetMemberId</text><text class="node-body" x="892" y="512">requesterUserId · consentedAt</text><text class="node-body" x="892" y="535">status · reviewerUserId</text><text class="node-body" x="892" y="558">认领和授权在审批事务内建立</text></g><g><rect x="392.05" y="128" width="55.9" height="23" rx="4" fill="#fff"/><text x="420" y="145" text-anchor="middle" class="edge-label">1 : N</text></g><g><rect x="812.05" y="128" width="55.9" height="23" rx="4" fill="#fff"/><text x="840" y="145" text-anchor="middle" class="edge-label">N : 1</text></g><g><rect x="219.06" y="333" width="91.88" height="23" rx="4" fill="#fff"/><text x="265" y="350" text-anchor="middle" class="edge-label">1 : N 名单</text></g><g><rect x="1064" y="333" width="72" height="23" rx="4" fill="#fff"/><text x="1100" y="350" text-anchor="middle" class="edge-label">本人请求</text></g><g><rect x="812.05" y="493" width="55.9" height="23" rx="4" fill="#fff"/><text x="840" y="510" text-anchor="middle" class="edge-label">1 : N</text></g><g><rect x="489" y="656" width="282" height="23" rx="4" fill="#fff"/><text x="630" y="673" text-anchor="middle" class="edge-label">批准后绑定原成员；唯一性与权限另行校验</text></g><text class="footer" x="35" y="730">同一账号可以属于多个队伍；未认领成员没有账号访问权。表字段为设计提案，完整约束见技术正文。</text></svg>