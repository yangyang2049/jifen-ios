<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="640" viewBox="0 0 1240 640" role="img" aria-labelledby="03-offline-cloud-state-title"><title id="03-offline-cloud-state-title">本机能力始终保留，云端写入按权限收敛</title><defs><marker id="03-offline-cloud-state-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0 L9 4.5 L0 9Z" fill="#536878"/></marker><marker id="03-offline-cloud-state-amber" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9Z" fill="#a16b23"/></marker></defs><style>text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;fill:#23323e}.diagram-title{font-size:22px;font-weight:600}.node-title{font-size:17px;font-weight:600}.node-body{font-size:15px}.edge-label{font-size:14px;fill:#4b5c69}.footer{font-size:14px;fill:#5b6a75}</style><rect width="100%" height="100%" fill="#fff"/><text x="35" y="32" class="diagram-title">本机能力始终保留，云端写入按权限收敛</text><polyline points="285,138 340,138" fill="none" stroke="#536878" stroke-width="1.7" stroke-linejoin="round"  marker-end="url(#03-offline-cloud-state-arrow)"/><polyline points="590,138 645,138" fill="none" stroke="#536878" stroke-width="1.7" stroke-linejoin="round"  marker-end="url(#03-offline-cloud-state-arrow)"/><polyline points="895,138 950,138" fill="none" stroke="#536878" stroke-width="1.7" stroke-linejoin="round"  marker-end="url(#03-offline-cloud-state-arrow)"/><polyline points="705,200 705,265 465,265 465,365" fill="none" stroke="#536878" stroke-width="1.7" stroke-linejoin="round"  marker-end="url(#03-offline-cloud-state-arrow)"/><polyline points="770,200 770,365" fill="none" stroke="#536878" stroke-width="1.7" stroke-linejoin="round"  marker-end="url(#03-offline-cloud-state-arrow)"/><polyline points="1075,200 1075,365" fill="none" stroke="#536878" stroke-width="1.7" stroke-linejoin="round"  marker-end="url(#03-offline-cloud-state-arrow)"/><polyline points="465,365 465,200" fill="none" stroke="#536878" stroke-width="1.7" stroke-linejoin="round"  marker-end="url(#03-offline-cloud-state-arrow)"/><g id="03-offline-cloud-state-local"><rect x="35" y="75" width="250" height="125" rx="11" fill="#edf7ef" stroke="#9fc9a9" /><text class="node-title" x="52" y="104">仅本机</text><text class="node-body" x="52" y="139">未登录也能建队、计分</text><text class="node-body" x="52" y="162">原始资料已落盘</text></g><g id="03-offline-cloud-state-queued"><rect x="340" y="75" width="250" height="125" rx="11" fill="#f7f9fa" stroke="#ccd6dd" /><text class="node-title" x="357" y="104">待上传</text><text class="node-body" x="357" y="139">用户确认目标账号与范围</text><text class="node-body" x="357" y="162">持久化操作与来源 ID</text></g><g id="03-offline-cloud-state-syncing"><rect x="645" y="75" width="250" height="125" rx="11" fill="#f7f9fa" stroke="#ccd6dd" /><text class="node-title" x="662" y="104">上传中</text><text class="node-body" x="662" y="139">队伍／名单先行</text><text class="node-body" x="662" y="162">依赖满足后上传比赛</text></g><g id="03-offline-cloud-state-cloud"><rect x="950" y="75" width="250" height="125" rx="11" fill="#edf7ef" stroke="#9fc9a9" /><text class="node-title" x="967" y="104">已同步</text><text class="node-body" x="967" y="139">返回云版本与回执</text><text class="node-body" x="967" y="162">其他获准设备可访问</text></g><g id="03-offline-cloud-state-retry"><rect x="340" y="365" width="250" height="135" rx="11" fill="#f7f9fa" stroke="#ccd6dd" /><text class="node-title" x="357" y="394">网络失败／重试</text><text class="node-body" x="357" y="429">保持相同操作 ID</text><text class="node-body" x="357" y="452">不删本机资料、不重复建队</text></g><g id="03-offline-cloud-state-conflict"><rect x="645" y="365" width="250" height="135" rx="11" fill="#fcf5e9" stroke="#d9bb8f" /><text class="node-title" x="662" y="394">版本冲突</text><text class="node-body" x="662" y="429">拉取当前状态后明确处理</text><text class="node-body" x="662" y="452">身份与权限不做盲目覆盖</text></g><g id="03-offline-cloud-state-reject"><rect x="950" y="365" width="250" height="135" rx="11" fill="#fcf5e9" stroke="#d9bb8f" /><text class="node-title" x="967" y="394">权限撤销／拒绝写入</text><text class="node-body" x="967" y="429">不更新共享队伍与榜单</text><text class="node-body" x="967" y="452">可保留私人比赛副本</text></g><g><rect x="507" y="228" width="86" height="23" rx="4" fill="#fff"/><text x="550" y="245" text-anchor="middle" class="edge-label">可重试错误</text></g><g><rect x="780.03" y="270" width="39.94" height="23" rx="4" fill="#fff"/><text x="800" y="287" text-anchor="middle" class="edge-label">409</text></g><g><rect x="1088" y="270" width="72" height="23" rx="4" fill="#fff"/><text x="1124" y="287" text-anchor="middle" class="edge-label">授权失效</text></g><g><rect x="406" y="288" width="44" height="23" rx="4" fill="#fff"/><text x="428" y="305" text-anchor="middle" class="edge-label">重连</text></g><text class="footer" x="35" y="610">本地同步状态不等于比赛确认状态。切换账号不会把旧账号的队列交给新账号。</text></svg>