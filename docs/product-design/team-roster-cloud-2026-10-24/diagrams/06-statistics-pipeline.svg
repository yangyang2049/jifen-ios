<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="820" viewBox="0 0 1240 820" role="img" aria-labelledby="06-statistics-pipeline-title"><title id="06-statistics-pipeline-title">先明确同场与身份，再按数据覆盖程度统计</title><defs><marker id="06-statistics-pipeline-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0 L9 4.5 L0 9Z" fill="#536878"/></marker><marker id="06-statistics-pipeline-amber" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9Z" fill="#a16b23"/></marker></defs><style>text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;fill:#23323e}.diagram-title{font-size:22px;font-weight:600}.node-title{font-size:17px;font-weight:600}.node-body{font-size:15px}.edge-label{font-size:14px;fill:#4b5c69}.footer{font-size:14px;fill:#5b6a75}</style><rect width="100%" height="100%" fill="#fff"/><text x="35" y="32" class="diagram-title">先明确同场与身份，再按数据覆盖程度统计</text><polyline points="375,132 450,132" fill="none" stroke="#536878" stroke-width="1.7" stroke-linejoin="round"  marker-end="url(#06-statistics-pipeline-arrow)"/><polyline points="790,132 865,132" fill="none" stroke="#536878" stroke-width="1.7" stroke-linejoin="round"  marker-end="url(#06-statistics-pipeline-arrow)"/><polyline points="1035,200 1035,280 205,280 205,365" fill="none" stroke="#536878" stroke-width="1.7" stroke-linejoin="round"  marker-end="url(#06-statistics-pipeline-arrow)"/><polyline points="620,280 620,365" fill="none" stroke="#536878" stroke-width="1.7" stroke-linejoin="round"  marker-end="url(#06-statistics-pipeline-arrow)"/><polyline points="1035,280 1035,365" fill="none" stroke="#536878" stroke-width="1.7" stroke-linejoin="round"  marker-end="url(#06-statistics-pipeline-arrow)"/><polyline points="205,510 205,630" fill="none" stroke="#536878" stroke-width="1.7" stroke-linejoin="round"  marker-end="url(#06-statistics-pipeline-arrow)"/><polyline points="620,510 620,630" fill="none" stroke="#536878" stroke-width="1.7" stroke-linejoin="round"  marker-end="url(#06-statistics-pipeline-arrow)"/><polyline points="1035,510 1035,630" fill="none" stroke="#536878" stroke-width="1.7" stroke-linejoin="round"  marker-end="url(#06-statistics-pipeline-arrow)"/><polyline points="865,685 790,685" fill="none" stroke="#536878" stroke-width="1.7" stroke-linejoin="round"  marker-end="url(#06-statistics-pipeline-arrow)"/><g id="06-statistics-pipeline-sources"><rect x="35" y="65" width="340" height="135" rx="11" fill="#f7f9fa" stroke="#ccd6dd" /><text class="node-title" x="52" y="94">原始来源</text><text class="node-body" x="52" y="129">手机、手表、队伍记录、小组赛事</text><text class="node-body" x="52" y="152">来源会话／事件 ID；保留原始快照</text></g><g id="06-statistics-pipeline-canonical"><rect x="450" y="65" width="340" height="135" rx="11" fill="#edf7ef" stroke="#9fc9a9" /><text class="node-title" x="467" y="94">同场归并与有效版本</text><text class="node-body" x="467" y="129">可靠来源键映射到 contestId</text><text class="node-body" x="467" y="152">无可靠键：只提示疑似重复</text></g><g id="06-statistics-pipeline-identity"><rect x="865" y="65" width="340" height="135" rx="11" fill="#f7f9fa" stroke="#ccd6dd" /><text class="node-title" x="882" y="94">身份与范围解析</text><text class="node-body" x="882" y="129">明确成员／本人账号映射</text><text class="node-body" x="882" y="152">项目、时间、队伍／赛事、可信等级</text></g><g id="06-statistics-pipeline-team"><rect x="35" y="365" width="340" height="145" rx="11" fill="#edf7ef" stroke="#9fc9a9" /><text class="node-title" x="52" y="394">队伍战绩与战绩榜</text><text class="node-body" x="52" y="429">最终有效结果足够</text><text class="node-body" x="52" y="452">场次、胜负平、得失分、胜率</text><text class="node-body" x="52" y="475">不推断竞技水平或全站排名</text></g><g id="06-statistics-pipeline-attendance"><rect x="450" y="365" width="340" height="145" rx="11" fill="#f7f9fa" stroke="#ccd6dd" /><text class="node-title" x="467" y="394">队员出场</text><text class="node-body" x="467" y="429">只计算明确确认的本场名单</text><text class="node-body" x="467" y="452">全队名单不等于出场名单</text><text class="node-body" x="467" y="475">未知不记作出场</text></g><g id="06-statistics-pipeline-points"><rect x="865" y="365" width="340" height="145" rx="11" fill="#f7f9fa" stroke="#ccd6dd" /><text class="node-title" x="882" y="394">已记录球员得分榜</text><text class="node-body" x="882" y="429">需要球员归属事件</text><text class="node-body" x="882" y="452">撤销／纠错后重算</text><text class="node-body" x="882" y="475">不生成未记录的篮板或助攻</text></g><g id="06-statistics-pipeline-coverage"><rect x="865" y="630" width="340" height="110" rx="11" fill="#fcf5e9" stroke="#d9bb8f" /><text class="node-title" x="882" y="659">覆盖率示例</text><text class="node-body" x="882" y="694">球队 68 = 已归属 53 + 未归属 15</text><text class="node-body" x="882" y="717">得分归属覆盖率约 78%</text></g><g id="06-statistics-pipeline-report"><rect x="35" y="630" width="755" height="110" rx="11" fill="#f7f9fa" stroke="#ccd6dd" /><text class="node-title" x="52" y="659">个人回顾与后续分析</text><text class="node-body" x="52" y="694">使用明确本人、已去重且符合可信等级的数据</text><text class="node-body" x="52" y="717">同时保留统计范围、有效版本、缺失指标与覆盖率</text></g><g><rect x="784" y="647" width="86" height="23" rx="4" fill="#fff"/><text x="827" y="664" text-anchor="middle" class="edge-label">带覆盖信息</text></g><text class="footer" x="35" y="790">修订、作废、接受变化与身份认领均触发受影响统计更新；统计缓存可以重建。</text></svg>