<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-labelledby="01-product-domain-title"><title id="01-product-domain-title">队伍独立存在，小组按需引用</title><defs><marker id="01-product-domain-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0 L9 4.5 L0 9Z" fill="#536878"/></marker><marker id="01-product-domain-amber" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9Z" fill="#a16b23"/></marker></defs><style>text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;fill:#23323e}.diagram-title{font-size:22px;font-weight:600}.node-title{font-size:17px;font-weight:600}.node-body{font-size:15px}.edge-label{font-size:14px;fill:#4b5c69}.footer{font-size:14px;fill:#5b6a75}</style><rect width="100%" height="100%" fill="#fff"/><text x="35" y="32" class="diagram-title">队伍独立存在，小组按需引用</text><polyline points="345,145 445,145" fill="none" stroke="#536878" stroke-width="1.7" stroke-linejoin="round"  marker-end="url(#01-product-domain-arrow)"/><polyline points="755,145 855,145" fill="none" stroke="#536878" stroke-width="1.7" stroke-linejoin="round"  marker-end="url(#01-product-domain-arrow)"/><polyline points="190,220 190,350" fill="none" stroke="#536878" stroke-width="1.7" stroke-linejoin="round"  marker-end="url(#01-product-domain-arrow)"/><polyline points="345,420 445,420" fill="none" stroke="#536878" stroke-width="1.7" stroke-linejoin="round"  marker-end="url(#01-product-domain-arrow)"/><polyline points="855,420 755,420" fill="none" stroke="#536878" stroke-width="1.7" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#01-product-domain-arrow)"/><g id="01-product-domain-team"><rect x="35" y="75" width="310" height="145" rx="11" fill="#edf7ef" stroke="#9fc9a9" /><text class="node-title" x="52" y="104">队伍</text><text class="node-body" x="52" y="139">长期阵容、项目、队名</text><text class="node-body" x="52" y="162">无需先建小组；可先仅在本机</text></g><g id="01-product-domain-roster"><rect x="445" y="75" width="310" height="145" rx="11" fill="#f7f9fa" stroke="#ccd6dd" /><text class="node-title" x="462" y="104">队员与本场阵容</text><text class="node-body" x="462" y="139">名单可包含尚未注册的人</text><text class="node-body" x="462" y="162">每场另选实际出场者</text></g><g id="01-product-domain-account"><rect x="855" y="75" width="310" height="145" rx="11" fill="#f7f9fa" stroke="#ccd6dd" /><text class="node-title" x="872" y="104">本人账号</text><text class="node-body" x="872" y="139">本人同意与管理方确认后认领</text><text class="node-body" x="872" y="162">应用昵称与队内昵称各有范围</text></g><g id="01-product-domain-local"><rect x="35" y="350" width="310" height="145" rx="11" fill="#f7f9fa" stroke="#ccd6dd" /><text class="node-title" x="52" y="379">普通离线比赛</text><text class="node-body" x="52" y="414">选择队伍、阵容、记录比分</text><text class="node-body" x="52" y="437">保存本机记录与本机统计</text></g><g id="01-product-domain-cloud"><rect x="445" y="350" width="310" height="145" rx="11" fill="#edf7ef" stroke="#9fc9a9" /><text class="node-title" x="462" y="379">云队伍与共享记录</text><text class="node-body" x="462" y="414">选择上云、邀请、跨设备访问</text><text class="node-body" x="462" y="437">同步成功不等于双方确认</text></g><g id="01-product-domain-group"><rect x="855" y="350" width="310" height="145" rx="11" fill="#f0f3f6" stroke="#ccd6dd" stroke-dasharray="5 4"/><text class="node-title" x="872" y="379">小组的队伍赛事（后续）</text><text class="node-body" x="872" y="414">引用既有队伍，独立报名授权</text><text class="node-body" x="872" y="437">当前个人单／双打继续保留</text></g><g><rect x="373" y="109" width="44" height="23" rx="4" fill="#fff"/><text x="395" y="126" text-anchor="middle" class="edge-label">包含</text></g><g><rect x="783" y="109" width="44" height="23" rx="4" fill="#fff"/><text x="805" y="126" text-anchor="middle" class="edge-label">认领</text></g><g><rect x="209" y="268" width="72" height="23" rx="4" fill="#fff"/><text x="245" y="285" text-anchor="middle" class="edge-label">无需网络</text></g><g><rect x="359" y="384" width="72" height="23" rx="4" fill="#fff"/><text x="395" y="401" text-anchor="middle" class="edge-label">选择上传</text></g><g><rect x="762" y="384" width="86" height="23" rx="4" fill="#fff"/><text x="805" y="401" text-anchor="middle" class="edge-label">引用与确认</text></g><text class="footer" x="35" y="550">队伍、账号与小组的关系独立；不因同名、登录或引用队伍而自动合并身份或授权。</text></svg>