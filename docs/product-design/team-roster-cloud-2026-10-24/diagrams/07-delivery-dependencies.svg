<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="620" viewBox="0 0 1240 620" role="img" aria-labelledby="07-delivery-dependencies-title"><title id="07-delivery-dependencies-title">独立队伍先形成闭环，再扩展球员事件与小组赛事</title><defs><marker id="07-delivery-dependencies-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0 L9 4.5 L0 9Z" fill="#536878"/></marker><marker id="07-delivery-dependencies-amber" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9Z" fill="#a16b23"/></marker></defs><style>text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;fill:#23323e}.diagram-title{font-size:22px;font-weight:600}.node-title{font-size:17px;font-weight:600}.node-body{font-size:15px}.edge-label{font-size:14px;fill:#4b5c69}.footer{font-size:14px;fill:#5b6a75}</style><rect width="100%" height="100%" fill="#fff"/><text x="35" y="32" class="diagram-title">独立队伍先形成闭环，再扩展球员事件与小组赛事</text><polyline points="285,140 340,140" fill="none" stroke="#536878" stroke-width="1.7" stroke-linejoin="round"  marker-end="url(#07-delivery-dependencies-arrow)"/><polyline points="590,140 645,140" fill="none" stroke="#536878" stroke-width="1.7" stroke-linejoin="round"  marker-end="url(#07-delivery-dependencies-arrow)"/><polyline points="895,140 950,140" fill="none" stroke="#536878" stroke-width="1.7" stroke-linejoin="round"  marker-end="url(#07-delivery-dependencies-arrow)"/><polyline points="1075,210 1075,285 770,285 770,365" fill="none" stroke="#536878" stroke-width="1.7" stroke-linejoin="round"  marker-end="url(#07-delivery-dependencies-arrow)"/><polyline points="1075,285 1075,365" fill="none" stroke="#536878" stroke-width="1.7" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#07-delivery-dependencies-arrow)"/><g id="07-delivery-dependencies-m0"><rect x="35" y="70" width="250" height="140" rx="11" fill="#f7f9fa" stroke="#ccd6dd" /><text class="node-title" x="52" y="99">M0 契约与样例</text><text class="node-body" x="52" y="134">身份、权限、同步与统计金样</text><text class="node-body" x="52" y="157">产品与各端共同评审</text></g><g id="07-delivery-dependencies-m1"><rect x="340" y="70" width="250" height="140" rx="11" fill="#edf7ef" stroke="#9fc9a9" /><text class="node-title" x="357" y="99">M1 本机队伍</text><text class="node-body" x="357" y="134">不登录能建队和计分</text><text class="node-body" x="357" y="157">名单、出场、旧数据兼容</text></g><g id="07-delivery-dependencies-m2"><rect x="645" y="70" width="250" height="140" rx="11" fill="#edf7ef" stroke="#9fc9a9" /><text class="node-title" x="662" y="99">M2 云队伍与邀请</text><text class="node-body" x="662" y="134">选择上云、多端、认领</text><text class="node-body" x="662" y="157">访问角色与队内昵称</text></g><g id="07-delivery-dependencies-m3"><rect x="950" y="70" width="250" height="140" rx="11" fill="#edf7ef" stroke="#9fc9a9" /><text class="node-title" x="967" y="99">M3 云战绩与灰度</text><text class="node-body" x="967" y="134">结果版本、确认等级</text><text class="node-body" x="967" y="157">共享战绩与出场统计</text></g><g id="07-delivery-dependencies-m4"><rect x="645" y="365" width="250" height="140" rx="11" fill="#f7f9fa" stroke="#ccd6dd" /><text class="node-title" x="662" y="394">M4 球员得分</text><text class="node-body" x="662" y="429">可选球员归属、未归属桶</text><text class="node-body" x="662" y="452">撤销、覆盖率与得分榜</text></g><g id="07-delivery-dependencies-m5"><rect x="950" y="365" width="250" height="140" rx="11" fill="#f0f3f6" stroke="#ccd6dd" stroke-dasharray="5 4"/><text class="node-title" x="967" y="394">M5 小组队伍赛事</text><text class="node-body" x="967" y="429">项目能力与 team 结果契约</text><text class="node-body" x="967" y="452">报名引用和赛事确认</text></g><text class="footer" x="35" y="590">阶段是依赖关系，不是日期承诺。云队伍不等待小组队伍赛；队伍战绩不等待完整球员技术统计。</text></svg>