<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="980" viewBox="0 0 1360 980" role="img" aria-labelledby="10-contest-results-erd-title"><title id="10-contest-results-erd-title">原始事实可追溯，结果确认绑定具体版本</title><defs><marker id="10-contest-results-erd-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0 L9 4.5 L0 9Z" fill="#536878"/></marker><marker id="10-contest-results-erd-amber" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9Z" fill="#a16b23"/></marker></defs><style>text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;fill:#23323e}.diagram-title{font-size:22px;font-weight:600}.node-title{font-size:17px;font-weight:600}.node-body{font-size:15px}.edge-label{font-size:14px;fill:#4b5c69}.footer{font-size:14px;fill:#5b6a75}</style><rect width="100%" height="100%" fill="#fff"/><text x="35" y="32" class="diagram-title">原始事实可追溯，结果确认绑定具体版本</text><polyline points="860,152 965,152" fill="none" stroke="#536878" stroke-width="1.7" stroke-linejoin="round"  marker-end="url(#10-contest-results-erd-arrow)"/><polyline points="500,152 440,152 440,320 215,320 215,385" fill="none" stroke="#536878" stroke-width="1.7" stroke-linejoin="round"  marker-end="url(#10-contest-results-erd-arrow)"/><polyline points="680,245 680,385" fill="none" stroke="#536878" stroke-width="1.7" stroke-linejoin="round"  marker-end="url(#10-contest-results-erd-arrow)"/><polyline points="860,185 915,185 915,325 1145,325 1145,385" fill="none" stroke="#536878" stroke-width="1.7" stroke-linejoin="round"  marker-end="url(#10-contest-results-erd-arrow)"/><polyline points="215,570 215,710" fill="none" stroke="#536878" stroke-width="1.7" stroke-linejoin="round"  marker-end="url(#10-contest-results-erd-arrow)"/><polyline points="680,570 680,710" fill="none" stroke="#536878" stroke-width="1.7" stroke-linejoin="round"  marker-end="url(#10-contest-results-erd-arrow)"/><polyline points="1145,570 1145,710" fill="none" stroke="#536878" stroke-width="1.7" stroke-linejoin="round"  marker-end="url(#10-contest-results-erd-arrow)"/><polyline points="965,802 860,802" fill="none" stroke="#536878" stroke-width="1.7" stroke-linejoin="round"  marker-end="url(#10-contest-results-erd-arrow)"/><polyline points="395,802 500,802" fill="none" stroke="#536878" stroke-width="1.7" stroke-linejoin="round"  marker-end="url(#10-contest-results-erd-arrow)"/><g id="10-contest-results-erd-refs"><rect x="35" y="60" width="360" height="185" rx="11" fill="#f7f9fa" stroke="#ccd6dd" /><text class="node-title" x="52" y="89">队伍与成员引用</text><text class="node-body" x="52" y="124">Team / TeamMember 的稳定 ID</text><text class="node-body" x="52" y="147">本场文字对手可没有云队伍 ID</text><text class="node-body" x="52" y="170">阵容及名称在结束时快照</text></g><g id="10-contest-results-erd-contest"><rect x="500" y="60" width="360" height="185" rx="11" fill="#edf7ef" stroke="#9fc9a9" /><text class="node-title" x="517" y="89">TeamContest</text><text class="node-body" x="517" y="124">originLibraryId · originSessionId</text><text class="node-body" x="517" y="147">sport · status · currentRevisionId</text><text class="node-body" x="517" y="170">recorder 不等于参赛人</text></g><g id="10-contest-results-erd-source"><rect x="965" y="60" width="360" height="185" rx="11" fill="#f7f9fa" stroke="#ccd6dd" /><text class="node-title" x="982" y="89">ContestSourceLink</text><text class="node-body" x="982" y="124">来源作用域 + 系统 + 记录 ID</text><text class="node-body" x="982" y="147">多来源明确指向同一 contestId</text><text class="node-body" x="982" y="170">无可靠来源键不自动合并</text></g><g id="10-contest-results-erd-side"><rect x="35" y="385" width="360" height="185" rx="11" fill="#f7f9fa" stroke="#ccd6dd" /><text class="node-title" x="52" y="414">TeamContestSide</text><text class="node-body" x="52" y="449">contestId + side 唯一</text><text class="node-body" x="52" y="472">teamId? · teamNameSnapshot</text><text class="node-body" x="52" y="495">未知对手保留文字，不授予权限</text></g><g id="10-contest-results-erd-event"><rect x="500" y="385" width="360" height="185" rx="11" fill="#f7f9fa" stroke="#ccd6dd" /><text class="node-title" x="517" y="414">TeamScoreEvent</text><text class="node-body" x="517" y="449">originEventId · sequence · sideId</text><text class="node-body" x="517" y="472">memberRef? · points · kind</text><text class="node-body" x="517" y="495">reversesEventId? · 追加事件</text></g><g id="10-contest-results-erd-revision"><rect x="965" y="385" width="360" height="185" rx="11" fill="#edf7ef" stroke="#9fc9a9" /><text class="node-title" x="982" y="414">TeamResultRevision</text><text class="node-body" x="982" y="449">contestId + revision 唯一</text><text class="node-body" x="982" y="472">scoreA / B · lineupHash · eventsHash</text><text class="node-body" x="982" y="495">不可覆盖已确认版本</text></g><g id="10-contest-results-erd-appearance"><rect x="35" y="710" width="360" height="185" rx="11" fill="#f7f9fa" stroke="#ccd6dd" /><text class="node-title" x="52" y="739">TeamAppearance</text><text class="node-body" x="52" y="774">contestId · sideId · memberId?</text><text class="node-body" x="52" y="797">nameSnapshot · appearanceState</text><text class="node-body" x="52" y="820">名单未知不当作已出场</text></g><g id="10-contest-results-erd-projection"><rect x="500" y="710" width="360" height="185" rx="11" fill="#f7f9fa" stroke="#ccd6dd" /><text class="node-title" x="517" y="739">TeamStatsProjection</text><text class="node-body" x="517" y="774">范围 + 项目 + 时间 + 指标版本</text><text class="node-body" x="517" y="797">statsRevision · coverage</text><text class="node-body" x="517" y="820">派生数据，可从事实重建</text></g><g id="10-contest-results-erd-acceptance"><rect x="965" y="710" width="360" height="185" rx="11" fill="#f7f9fa" stroke="#ccd6dd" /><text class="node-title" x="982" y="739">TeamResultAcceptance</text><text class="node-body" x="982" y="774">resultRevisionId + teamId 唯一</text><text class="node-body" x="982" y="797">status · actorUserId · mode</text><text class="node-body" x="982" y="820">只接受该比分与阵容版本</text></g><g><rect x="866.06" y="115" width="91.88" height="23" rx="4" fill="#fff"/><text x="912" y="132" text-anchor="middle" class="edge-label">1 : N 来源</text></g><g><rect x="302.05" y="283" width="55.9" height="23" rx="4" fill="#fff"/><text x="330" y="300" text-anchor="middle" class="edge-label">1 : 2</text></g><g><rect x="687.06" y="297" width="91.88" height="23" rx="4" fill="#fff"/><text x="733" y="314" text-anchor="middle" class="edge-label">1 : N 事件</text></g><g><rect x="997.06" y="288" width="91.88" height="23" rx="4" fill="#fff"/><text x="1043" y="305" text-anchor="middle" class="edge-label">1 : N 修订</text></g><g><rect x="227" y="623" width="72" height="23" rx="4" fill="#fff"/><text x="263" y="640" text-anchor="middle" class="edge-label">本场阵容</text></g><g><rect x="692" y="623" width="72" height="23" rx="4" fill="#fff"/><text x="728" y="640" text-anchor="middle" class="edge-label">有效事件</text></g><g><rect x="1154.06" y="623" width="91.88" height="23" rx="4" fill="#fff"/><text x="1200" y="640" text-anchor="middle" class="edge-label">1 : N 接受</text></g><g><rect x="877" y="765" width="72" height="23" rx="4" fill="#fff"/><text x="913" y="782" text-anchor="middle" class="edge-label">可信等级</text></g><g><rect x="412" y="765" width="72" height="23" rx="4" fill="#fff"/><text x="448" y="782" text-anchor="middle" class="edge-label">明确出场</text></g><text class="footer" x="35" y="950">示意图展示主干关系。事实、身份解析、可信等级和统计缓存必须能够分别追溯与重算。</text></svg>